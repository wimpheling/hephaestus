[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[workspace.dependencies]
async-trait = "0.1"
async-nats = "0.42"
aes-gcm = "0.10"
axum = "0.8"
base64 = "0.22"
bytes = "1"
buffa = { version = "=0.8.1", features = ["json"] }
buffa-descriptor = { version = "=0.8.1", features = ["reflect"] }
buffa-types = { version = "=0.8.1", features = ["json"] }
ciborium = "0.2"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3"
connectrpc = { version = "=0.8.1", features = ["server"] }
connectrpc-reflection = "=0.8.0"
futures-util = "0.3"
gix = { version = "0.72", default-features = false, features = ["revision"] }
http = "1"
hmac = "0.12"
jsonwebtoken = "9"
proptest = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
libloading = "0.8"
libc = "0.2"
rustix = { version = "1", features = ["fs", "process"] }
# SQLx 0.8 and the guest probe share one bundled SQLite C library in the
# workspace dependency graph.
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8.6", default-features = false, features = [
    "json",
    "macros",
    "migrate",
    "postgres",
    "runtime-tokio-rustls",
    "time",
    "uuid",
] }
thiserror = "2"
# Keep the audited release fixed independently of the workspace's RPC-driven
# Rust 1.88 floor.
time = { version = "=0.3.45", features = ["serde"] }
tokio = { version = "1", features = ["sync"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt"] }
toml = "0.9"
tracing = "0.1"
uuid = { version = "1", features = ["serde", "v4"] }
vm-trait = { path = "crates/vm-trait" }
zeroize = "1"

[workspace.lints.rust]
missing_docs = "deny"
unsafe_code = "deny"
warnings = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
cargo = { level = "deny", priority = -1 }
nursery = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
# Publishing metadata will be enforced once the project license is selected.
cargo_common_metadata = { level = "allow", priority = 1 }
# Tokio's macros use syn 2 while async-trait uses syn 3.
multiple_crate_versions = { level = "allow", priority = 1 }

[workspace.lints.rustdoc]
all = "deny"
