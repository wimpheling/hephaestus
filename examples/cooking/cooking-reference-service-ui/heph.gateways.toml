version = 1

[[gateways]]
name = "cooking-reference-service-ui"
agent_name = "cooking-reference-service-ui"
handler_contract = "http.service.v1"
exposure = "heph_authenticated"

[gateways.service]
loopback_port = 8080
readiness_path = "/readyz"
health_path = "/healthz"
log_capture_mode = "application"

[[gateways.routes]]
path = "/reference"
methods = ["GET"]
