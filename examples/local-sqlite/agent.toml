version = 2

[agent]
name = "Local SQLite application"
key = "local-sqlite"

[build]
command = "/bin/sh"
arguments = ["build.sh"]
working_directory = "/workspace/source"
image = { key = "python-ubuntu" }
triggers = ["refs/heads/main"]

[build.resources]
vcpus = 1
memory_mib = 256

[build.network]
profile = "disabled"

[[build.artifacts]]
path = "bin/local-sqlite"
kind = "executable"
media_type = "text/x-python"

[guest]
image = { key = "python-ubuntu" }
command = "bin/local-sqlite"
working_directory = "bin"

[resources]
vcpus = 1
memory_mib = 256

[workspace]
mount = false
path = "/workspace/source"
read_only = true

[state_volume]
enabled = false

[[volume_slots]]
slot = "data"
guest_path = "/data"
access_mode = "read_write"
required = true
minimum_capacity_bytes = 16777216

[network]
profile = "disabled"

[triggers]
push = false
refs = []

[[parameters]]
name = "operation"
type = "string"
minimum_length = 1
maximum_length = 16
required = true
default = "inspect"

[[parameters]]
name = "key"
type = "string"
minimum_length = 0
maximum_length = 128
required = false
default = ""

[[parameters]]
name = "value"
type = "string"
minimum_length = 0
maximum_length = 4096
required = false
default = ""
