[package]
name = "release-postgres"
description = "PostgreSQL release and instance command adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
agent-config = { path = "../agent-config" }
brokered-egress-domain = { path = "../brokered-egress-domain" }
authz-domain = { path = "../authz-domain" }
authz-postgres = { path = "../authz-postgres" }
capability-domain = { path = "../capability-domain" }
forge-domain = { path = "../forge-domain" }
git-capability-domain = { path = "../git-capability-domain" }
identity-domain = { path = "../identity-domain" }
release-domain = { path = "../release-domain" }
release-service = { path = "../release-service" }
run-domain = { path = "../run-domain" }
runtime-types = { path = "../runtime-types" }
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
async-nats.workspace = true
event-postgres = { path = "../event-postgres" }
futures-util.workspace = true
mailbox-domain = { path = "../mailbox-domain" }
mailbox-dispatch = { path = "../mailbox-dispatch" }
mailbox-postgres = { path = "../mailbox-postgres" }
secret-application = { path = "../secret-application" }
secret-domain = { path = "../secret-domain" }
secret-postgres = { path = "../secret-postgres" }
secret-store = { path = "../secret-store" }
serial_test = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[package.metadata.hephaestus]
layer = "adapter"
context = "release"
allow_cross_context_dependencies = ["authz-postgres"]
postgres_adapter = true
database_context = "release"
