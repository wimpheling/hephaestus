[package]
name = "builder-catalog-application"
description = "Builder catalog application port and agent.toml selection validation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.hephaestus]
layer = "application"
context = "build"
allow_cross_context_dependencies = ["agent-config"]

[dependencies]
agent-config = { path = "../agent-config" }
async-trait.workspace = true
builder-catalog-domain = { path = "../builder-catalog-domain" }
thiserror.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
