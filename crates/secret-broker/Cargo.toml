[package]
name = "secret-broker"
description = "Bounded guest-to-host secret broker transport"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.hephaestus]
layer = "adapter"
context = "secret"

[dependencies]
async-trait.workspace = true
runtime-types = { path = "../runtime-types" }
secret-domain = { path = "../secret-domain" }
secret-application = { path = "../secret-application" }
secret-store = { path = "../secret-store" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "rt", "sync", "time"] }
tokio-util.workspace = true
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
