[package]
name = "gateway-postgres"
description = "PostgreSQL installation authority for repository-declared HTTP gateways"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.hephaestus]
layer = "adapter"
context = "gateway"
allow_cross_context_dependencies = ["authz-postgres", "runtime-authority"]
postgres_adapter = true
database_context = "gateway"

[dependencies]
agent-config = { path = "../agent-config" }
authz-domain = { path = "../authz-domain" }
authz-postgres = { path = "../authz-postgres" }
async-trait.workspace = true
capability-domain = { path = "../capability-domain" }
forge-domain = { path = "../forge-domain" }
gateway-edge = { path = "../gateway-edge" }
gateway-domain = { path = "../gateway-domain" }
http.workspace = true
identity-domain = { path = "../identity-domain" }
release-domain = { path = "../release-domain" }
runtime-authority = { path = "../runtime-authority" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["sync"] }
thiserror.workspace = true
uuid.workspace = true
vm-trait = { path = "../vm-trait" }

[lints]
workspace = true
