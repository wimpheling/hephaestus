# Stable cursor contracts for secret metadata and grant projections.

[[queries]]
item = "SecretApplication::list_project_secrets"
query_index = 1
order = ["secret.name ASC", "secret.id ASC"]
cursor_keys = ["secret.name", "secret.id"]
cursor_operator = ">"
unique_tie_breaker = "secret.id"
unique_keys = ["secret.id"]
cursor_mode = "uuid_row_lookup"

[[queries]]
item = "SecretApplication::list_organization_secrets"
query_index = 1
order = ["secret.name ASC", "secret.id ASC"]
cursor_keys = ["secret.name", "secret.id"]
cursor_operator = ">"
unique_tie_breaker = "secret.id"
unique_keys = ["secret.id"]
cursor_mode = "uuid_row_lookup"

[[queries]]
item = "SecretApplication::list_organization_grants"
query_index = 1
order = ["secret.name ASC", "secret_grant.created_at ASC", "secret_grant.id ASC"]
cursor_keys = ["secret.name", "secret_grant.created_at", "secret_grant.id"]
cursor_operator = ">"
unique_tie_breaker = "secret_grant.id"
unique_keys = ["secret_grant.id"]
cursor_mode = "uuid_row_lookup"

[[queries]]
item = "SecretApplication::project_authority"
query_index = 1
order = ["secret.name ASC", "secret_grant.created_at ASC", "secret_grant.id ASC"]
cursor_keys = ["secret.name", "secret_grant.created_at", "secret_grant.id"]
cursor_operator = ">"
unique_tie_breaker = "secret_grant.id"
unique_keys = ["secret_grant.id"]
cursor_mode = "uuid_row_lookup"

[[queries]]
item = "SecretApplication::project_authority"
query_index = 2
order = ["imported.alias ASC", "imported.id ASC"]
cursor_keys = ["imported.alias", "imported.id"]
cursor_operator = ">"
unique_tie_breaker = "imported.id"
unique_keys = ["imported.id"]
cursor_mode = "uuid_row_lookup"
