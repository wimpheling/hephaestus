[package]
name = "volume-postgres"
description = "PostgreSQL metadata adapter for persistent agent volumes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
runtime-types = { path = "../../../platform/runtime-types" }
sqlx.workspace = true
time.workspace = true
uuid.workspace = true
volume-trait = { path = "../trait" }

[dev-dependencies]
serial_test = "3"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[package.metadata.hephaestus]
layer = "adapter"
context = "volume"
postgres_adapter = true
database_context = "volume"
