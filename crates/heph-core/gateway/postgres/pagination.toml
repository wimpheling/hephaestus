# Stable cursor contracts for gateway management and service projections.

[[queries]]
item = "PostgresGatewayManagement::list_project"
query_index = 1
order = ["id ASC"]
cursor_keys = ["id"]
cursor_operator = ">"
unique_tie_breaker = "id"
unique_keys = ["id"]

