[package]
name = "forge-postgres"
description = "PostgreSQL metadata adapter for forge receives and repositories"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
agent-config = { path = "../../platform/agent-config" }
authz-domain = { path = "../../authorization/authz-domain" }
authz-postgres = { path = "../../authorization/authz-postgres" }
forge-domain = { path = "../domain" }
forge-service = { path = "../service" }
gix.workspace = true
identity-domain = { path = "../../identity/domain" }
release-domain = { path = "../release/domain" }
run-domain = { path = "../../run/domain" }
runtime-types = { path = "../../platform/runtime-types" }
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
axum.workspace = true
base64.workspace = true
git-http = { path = "../git-http" }
git-capability-domain = { path = "../git-capability" }
capability-domain = { path = "../../authorization/capability-domain" }
runtime-git-authority = { path = "../../authorization/runtime-git-authority" }
runtime-git-authority-postgres = { path = "../../authorization/runtime-git-authority-postgres" }
pat-domain = { path = "../pat" }
pat-postgres = { path = "../pat-postgres" }
async-nats.workspace = true
futures-util.workspace = true
run-orchestrator = { path = "../../run/orchestrator" }
run-postgres = { path = "../../run/postgres" }
serial_test = "3"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
vm-trait.workspace = true
volume-postgres = { path = "../../runtime/volume/postgres" }

[lints]
workspace = true

[package.metadata.hephaestus]
layer = "adapter"
context = "forge"
allow_cross_context_dependencies = ["authz-postgres"]
postgres_adapter = true
database_context = "forge"
