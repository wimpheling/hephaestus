[package]
name = "registry-postgres"
description = "PostgreSQL control-plane adapter for forge-owned OCI registry publications"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.hephaestus]
layer = "adapter"
context = "registry"
postgres_adapter = true
database_context = "registry"
allow_cross_context_dependencies = ["authz-postgres"]

[dependencies]
builder-catalog-domain = { path = "../../../image/domain" }
authz-domain = { path = "../../../authorization/authz-domain" }
authz-postgres = { path = "../../../authorization/authz-postgres" }
forge-domain = { path = "../../domain" }
identity-domain = { path = "../../../identity/domain" }
registry-domain = { path = "../domain" }
runtime-types = { path = "../../../platform/runtime-types" }
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
uuid.workspace = true

[dev-dependencies]
serial_test = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
