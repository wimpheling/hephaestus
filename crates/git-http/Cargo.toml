[package]
name = "git-http"
description = "Authorized streaming Git smart-HTTP transport for Hephaestus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.hephaestus]
layer = "transport"
context = "forge"
allow_cross_context_dependencies = ["identity-oidc"]

[[bin]]
name = "pre-receive"
path = "src/bin/hephaestus-git-pre-receive.rs"

[dependencies]
async-trait.workspace = true
authz-domain = { path = "../authz-domain" }
axum.workspace = true
base64.workspace = true
bytes.workspace = true
forge-domain = { path = "../forge-domain" }
forge-service = { path = "../forge-service" }
forge-postgres = { path = "../forge-postgres" }
futures-util.workspace = true
git-capability-domain = { path = "../git-capability-domain" }
http.workspace = true
identity-domain = { path = "../identity-domain" }
identity-application = { path = "../identity-application" }
identity-oidc = { path = "../identity-oidc" }
pat-domain = { path = "../pat-domain" }
pat-postgres = { path = "../pat-postgres" }
runtime-git-authority = { path = "../runtime-git-authority" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tempfile = "3"
tokio = { workspace = true, features = ["io-util", "net", "process", "rt", "sync", "time"] }
tokio-stream.workspace = true
tracing.workspace = true
time.workspace = true
zeroize.workspace = true

[dev-dependencies]
serial_test = "3"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid.workspace = true

[lints]
workspace = true
