[package]
name = "git-http"
description = "Authorized streaming Git smart-HTTP transport for Hephaestus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
authz-domain = { path = "../authz-domain" }
axum.workspace = true
bytes.workspace = true
forge-domain = { path = "../forge-domain" }
forge-service = { path = "../forge-service" }
forge-postgres = { path = "../forge-postgres" }
futures-util.workspace = true
http.workspace = true
identity-domain = { path = "../identity-domain" }
identity-application = { path = "../identity-application" }
identity-oidc = { path = "../identity-oidc" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["io-util", "net", "process", "rt", "sync", "time"] }
tokio-stream.workspace = true
tracing.workspace = true

[dev-dependencies]
serial_test = "3"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid.workspace = true

[lints]
workspace = true
