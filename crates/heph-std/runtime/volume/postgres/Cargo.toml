[package]
name = "volume-postgres"
description = "PostgreSQL metadata adapter for persistent agent volumes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
release-service = { path = "../../../../heph-core/forge/release/service" }
async-trait.workspace = true
authz-domain = { path = "../../../../heph-core/auth/authorization/authz-domain" }
authz-postgres = { path = "../../../authorization/authz-postgres" }
capability-domain = { path = "../../../../heph-core/auth/authorization/capability-domain" }
identity-domain = { path = "../../../../heph-core/auth/identity/domain" }
runtime-types = { path = "../../../../heph-core/platform/runtime-types" }
serde_json.workspace = true
sqlx.workspace = true
time.workspace = true
uuid.workspace = true
volume-trait = { path = "../../../../heph-core/runtime/volume/trait" }
volume-domain = { path = "../../../../heph-core/runtime/volume/domain" }

[dev-dependencies]
# Scalar hook compatibility is exercised against the actual release callbacks.
release-postgres = { path = "../../../forge/release/postgres" }
run-domain = { path = "../../../../heph-core/runtime/run/domain" }
run-orchestrator = { path = "../../../../heph-core/runtime/run/orchestrator" }
run-postgres = { path = "../../../run/postgres" }
serial_test = "3"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
volume-local = { path = "../local" }
vm-trait = { path = "../../../../heph-core/runtime/vm/trait" }

[lints]
workspace = true

[package.metadata.hephaestus]
layer = "adapter"
context = "volume"
# Actor resource operations reuse the transaction-scoped authorization adapter.
allow_cross_context_dependencies = ["authz-postgres"]
postgres_adapter = true
database_context = "volume"
