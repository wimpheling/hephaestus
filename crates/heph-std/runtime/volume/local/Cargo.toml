[package]
name = "volume-local"
description = "Single-host persistent volume store for Hephaestus"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.hephaestus]
layer = "adapter"
context = "volume"

[dependencies]
identity-domain = { path = "../../../../heph-core/auth/identity/domain" }
async-trait.workspace = true
runtime-types = { path = "../../../../heph-core/platform/runtime-types" }
rustix.workspace = true
sha2.workspace = true
time.workspace = true
tokio = { workspace = true, features = ["fs", "process", "time"] }
tracing.workspace = true
uuid.workspace = true
volume-trait = { path = "../../../../heph-core/runtime/volume/trait" }
volume-domain = { path = "../../../../heph-core/runtime/volume/domain" }

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
