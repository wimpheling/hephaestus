[package]
name = "release-postgres"
description = "PostgreSQL release and instance command adapter"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
agent-config = { path = "../../../../heph-core/platform/agent-config" }
brokered-egress-domain = { path = "../../../../heph-core/auth/secret/brokered-egress-domain" }
authz-domain = { path = "../../../../heph-core/auth/authorization/authz-domain" }
authz-postgres = { path = "../../../authorization/authz-postgres" }
capability-domain = { path = "../../../../heph-core/auth/authorization/capability-domain" }
forge-domain = { path = "../../../../heph-core/forge/domain" }
gateway-domain = { path = "../../../../heph-core/platform/gateway/domain" }
git-capability-domain = { path = "../../../../heph-core/forge/git-capability" }
identity-domain = { path = "../../../../heph-core/auth/identity/domain" }
release-domain = { path = "../../../../heph-core/forge/release/domain" }
release-service = { path = "../../../../heph-core/forge/release/service" }
run-domain = { path = "../../../../heph-core/runtime/run/domain" }
runtime-types = { path = "../../../../heph-core/platform/runtime-types" }
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
thiserror.workspace = true
time.workspace = true
toml.workspace = true
tracing.workspace = true
uuid.workspace = true

[dev-dependencies]
async-nats.workspace = true
event-postgres = { path = "../../../event/postgres" }
futures-util.workspace = true
mailbox-domain = { path = "../../../../heph-core/runtime/mailbox/domain" }
mailbox-dispatch = { path = "../../../runtime/mailbox/dispatch" }
mailbox-postgres = { path = "../../../runtime/mailbox/postgres" }
secret-application = { path = "../../../../heph-core/auth/secret/application" }
secret-domain = { path = "../../../../heph-core/auth/secret/domain" }
secret-postgres = { path = "../../../secret/postgres" }
secret-store = { path = "../../../../heph-core/auth/secret/store", features = ["test-fixtures"] }
serial_test = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[package.metadata.hephaestus]
layer = "adapter"
context = "release"
allow_cross_context_dependencies = ["authz-postgres"]
postgres_adapter = true
database_context = "release"
