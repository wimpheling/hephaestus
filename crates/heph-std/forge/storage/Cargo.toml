[package]
name = "forge-storage"
description = "Canonical bare-Git filesystem and process storage for forge"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
forge-domain = { path = "../../../heph-core/forge/domain" }
