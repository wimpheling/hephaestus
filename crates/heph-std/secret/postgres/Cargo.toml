[package]
name = "secret-postgres"
description = "PostgreSQL adapter for encrypted secret and runtime-mount metadata"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.hephaestus]
layer = "adapter"
context = "secret"
allow_cross_context_dependencies = ["authz-postgres"]
database_context = "secret"
postgres_adapter = true
transactional_outbox = false
row_level_security = true

[dependencies]
async-trait.workspace = true
authz-domain = { path = "../../../heph-core/auth/authorization/authz-domain" }
authz-postgres = { path = "../../authorization/authz-postgres" }
brokered-egress-domain = { path = "../../../heph-core/auth/secret/brokered-egress-domain" }
capability-domain = { path = "../../../heph-core/auth/authorization/capability-domain" }
forge-domain = { path = "../../../heph-core/forge/domain" }
gateway-domain = { path = "../../../heph-core/platform/gateway/domain" }
http.workspace = true
identity-domain = { path = "../../../heph-core/auth/identity/domain" }
release-domain = { path = "../../../heph-core/forge/release/domain" }
run-domain = { path = "../../../heph-core/runtime/run/domain" }
run-orchestrator = { path = "../../../heph-core/runtime/run/orchestrator" }
runtime-types = { path = "../../../heph-core/platform/runtime-types" }
heph-secret = { path = "../../../heph-core/auth/secret" }
secret-domain = { path = "../../../heph-core/auth/secret/domain" }
secret-application = { path = "../../../heph-core/auth/secret/application" }
secret-store = { path = "../../../heph-core/auth/secret/store" }
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
tracing.workspace = true
uuid.workspace = true
time.workspace = true
thiserror.workspace = true

[lints]
workspace = true

[dev-dependencies]
secret-store = { path = "../../../heph-core/auth/secret/store", features = ["test-fixtures"] }
serial_test = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
