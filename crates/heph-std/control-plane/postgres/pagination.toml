# Static contracts for cursor-paginated PostgreSQL adapter queries.
# `unique_keys` is an explicit schema-backed uniqueness assertion supplied by
# the adapter owner; the checker requires the final tie breaker to be listed.

[[queries]]
item = "BuildApplication::list_builds"
query_index = 1
order = ["request.created_at DESC", "request.id DESC"]
cursor_keys = ["request.created_at", "request.id"]
cursor_operator = "<"
unique_tie_breaker = "request.id"
unique_keys = ["request.id"]
cursor_mode = "uuid_row_lookup"

[[queries]]
item = "EventApplication::read_after"
query_index = 1
order = ["cursor ASC"]
cursor_keys = ["cursor"]
cursor_operator = ">"
unique_tie_breaker = "cursor"
unique_keys = ["cursor"]

