[package]
name = "capability-audit-postgres"
description = "PostgreSQL adapter for redacted capability audit evidence"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.hephaestus]
layer = "adapter"
context = "authorization"
postgres_adapter = true
database_context = "authorization"

[dependencies]
async-trait.workspace = true
authz-postgres = { path = "../authz-postgres" }
capability-audit = { path = "../../../heph-core/auth/authorization/capability-audit" }
capability-domain = { path = "../../../heph-core/auth/authorization/capability-domain" }
identity-domain = { path = "../../../heph-core/auth/identity/domain" }
runtime-types = { path = "../../../heph-core/platform/runtime-types" }
sqlx.workspace = true
time.workspace = true
uuid.workspace = true

[dev-dependencies]
serde_json.workspace = true
serial_test = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
