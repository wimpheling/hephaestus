[package]
name = "review-postgres"
description = "PostgreSQL persistence adapter for durable review controls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
async-trait.workspace = true
authz-domain = { path = "../authz-domain" }
authz-postgres = { path = "../authz-postgres" }
forge-domain = { path = "../forge-domain" }
forge-service = { path = "../forge-service" }
identity-domain = { path = "../identity-domain" }
release-domain = { path = "../release-domain" }
review-domain = { path = "../review-domain" }
review-service = { path = "../review-service" }
run-domain = { path = "../run-domain" }
runtime-types = { path = "../runtime-types" }
serde_json.workspace = true
sqlx.workspace = true
time.workspace = true
uuid.workspace = true

[dev-dependencies]
forge-service = { path = "../forge-service" }
identity-domain = { path = "../identity-domain" }
serial_test = "3"
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true

[package.metadata.hephaestus]
layer = "adapter"
context = "review"
allow_cross_context_dependencies = ["authz-postgres"]
postgres_adapter = true
database_context = "review"
