[package]
name = "oci-builder-worker"
description = "Isolated OCI preparation and VM-root materialization worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.hephaestus]
layer = "adapter"
context = "build"

[dependencies]
async-trait.workspace = true
builder-catalog-domain = { path = "../builder-catalog-domain" }
registry-domain = { path = "../registry-domain" }
registry-token = { path = "../registry-token" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["process", "rt", "sync", "time"] }
uuid.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["macros", "rt"] }

[lints]
workspace = true
