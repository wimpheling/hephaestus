[package]
name = "forge-service"
description = "Provider-neutral forge ports and bare-Git storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[package.metadata.hephaestus]
layer = "application"
context = "forge"

[dependencies]
async-nats.workspace = true
async-trait.workspace = true
forge-domain = { path = "../forge-domain" }
gix.workspace = true
release-domain = { path = "../release-domain" }
run-domain = { path = "../run-domain" }
runtime-types = { path = "../runtime-types" }
serde_json.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["fs", "process", "rt"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
