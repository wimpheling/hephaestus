name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust-and-authorization:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: docker.io/library/postgres@sha256:af194ccf3e2d7fe367012c7b88ce8b816c5c889b18a5b316799a1f0d7eac746a
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hephaestus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hephaestus"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      HEPHAESTUS_POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/hephaestus?sslmode=disable
      HEPHAESTUS_NATS_TEST_URL: nats://127.0.0.1:4222

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install integration dependencies
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs postgresql-client
      - name: Start JetStream
        run: docker run --detach --rm --name hephaestus-nats --publish 4222:4222 docker.io/library/nats@sha256:e4bf19f15fd3218814a4e3c9e0064e1334bd8aa20d5984b9f1a0afd084f8cc00 -js
      - name: Verify Mélange generation
        run: |
          scripts/install-melange.sh
          scripts/generate-authz.sh
      - name: Verify OpenFGA model locally
        run: |
          scripts/install-openfga-cli.sh
          scripts/check-openfga-model.sh
      - name: Verify OpenFGA compatibility service
        env:
          CONTAINER_ENGINE: docker
        run: scripts/check-openfga-service.sh
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features
      - name: Tests
        run: cargo test --workspace --all-features -- --test-threads=1
      - name: Browser-session RPC lifecycle integration
        timeout-minutes: 5
        run: scripts/test-browser-session-lifecycle.sh
      - name: UI installation RPC integration
        timeout-minutes: 5
        run: scripts/test-ui-installation-rpc.sh
      - name: Deferred update admission and reconciler race
        timeout-minutes: 15
        env:
          CONTAINER_ENGINE: docker
        run: scripts/test-update-admission-postgres-nats.sh
      - name: Mélange doctor
        run: scripts/check-authz.sh
      - name: Documentation
        run: cargo doc --workspace --all-features --no-deps

  cooking-applications:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install musl target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Test cooking gateway
        working-directory: examples/cooking/cooking-gateway
        run: |
          cargo test --locked --offline --all-features
          cargo build --locked --offline --release --target x86_64-unknown-linux-musl
      - name: Check cooking service
        working-directory: examples/cooking/cooking-service
        run: |
          cargo fmt --check
          cargo clippy --locked --offline --all-targets --all-features -- -D warnings
          cargo test --locked --offline --all-features
          cargo doc --locked --offline --all-features --no-deps
          cargo build --locked --offline --release --target x86_64-unknown-linux-musl
      - name: Test cooking agent, deterministic relay and Hugo output
        working-directory: examples/cooking/cooking-agent
        run: |
          set -Eeuo pipefail
          hugo_root="$(mktemp -d)"
          trap 'rm -rf -- "$hugo_root"' EXIT
          ../cooking-blog/verify-hugo.sh "$hugo_root/hugo"
          COOKING_HUGO_BINARY="$hugo_root/hugo" python3 -B -m unittest -v
      - name: Test reference session-chat Python release
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s examples/session-chat -p 'test_*.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s examples/session-chat/tests -p 'test_*.py' -v
      - name: Check cooking blog
        working-directory: examples/cooking/cooking-blog
        run: python3 check.py
      - name: Test browser evidence scanner
        run: python3 -m unittest discover -s scripts -p test_browser_evidence.py
      - name: Test trusted GCP controller evidence contracts
        run: |
          bash -n scripts/gcp-cooking-run.sh scripts/gcp-kvm-smoke.sh scripts/gcp-kvm-startup.sh
          python3 -m unittest scripts.test_gcp_browser_summary scripts.test_gcp_cooking_scenario scripts.test_gcp_cooking_failure_attribution scripts.test_gcp_diagnostics_pipeline scripts.test_gcp_failure_reporting scripts.test_gcp_quota_contract scripts.test_gcp_kvm_smoke_cleanup scripts.test_gcp_phase_timing scripts.test_gcp_runner_image scripts.test_gcp_runner_image_build scripts.test_gcp_runner_image_bundle scripts.test_gcp_runner_image_compatibility scripts.test_gcp_runner_image_validator scripts.test_libkrun_runtime_root

  live-review-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/playwright/package-lock.json
      - name: Install local runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs podman
      - name: Install browser and operating-system dependencies
        working-directory: e2e/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test release UI kit
        working-directory: web/assets/release_ui_kit
        run: npm test
      - name: Installed UI navigation and bootstrap Node tests
        run: |
          node --test --test-isolation=none --test-reporter=tap \
            web/assets/js/design_system/hooks/installed_ui_navigation_test.mjs \
            crates/hephaestus-app/tests/ui_bootstrap_script.mjs \
            e2e/playwright/cooking-tests/session-chat-concurrent-parser.test.mjs \
            e2e/playwright/reporter-tests/safe-installed-ui-reporter.test.mjs
      - name: Installed UI bridge protocol
        run: scripts/test-ui-e2e-installed-bridge.sh
      - name: Installed UI browser startup diagnostics
        run: scripts/test-installed-ui-e2e-startup.sh
      - name: Phoenix and browser golden path
        env:
          HEPHAESTUS_PLAYWRIGHT_SKIP_BROWSER_INSTALL: "1"
        run: scripts/run-ui-e2e.sh
