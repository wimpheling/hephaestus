name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  rust-and-authorization:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: docker.io/library/postgres@sha256:af194ccf3e2d7fe367012c7b88ce8b816c5c889b18a5b316799a1f0d7eac746a
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: hephaestus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d hephaestus"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 20
    env:
      HEPHAESTUS_POSTGRES_TEST_URL: postgres://postgres:postgres@127.0.0.1:5432/hephaestus?sslmode=disable
      HEPHAESTUS_NATS_TEST_URL: nats://127.0.0.1:4222

    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: clippy,rustfmt,llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install integration dependencies
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs postgresql-client
      - name: Start JetStream
        run: docker run --detach --rm --name hephaestus-nats --publish 4222:4222 docker.io/library/nats@sha256:e4bf19f15fd3218814a4e3c9e0064e1334bd8aa20d5984b9f1a0afd084f8cc00 -js
      - name: Verify Mélange generation
        run: |
          scripts/install-melange.sh
          scripts/generate-authz.sh
      - name: Verify OpenFGA model locally
        run: |
          scripts/install-openfga-cli.sh
          scripts/check-openfga-model.sh
      - name: Verify OpenFGA compatibility service
        env:
          CONTAINER_ENGINE: docker
        run: scripts/check-openfga-service.sh
      - name: Formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --all-features
      - name: Tests
        run: cargo test --workspace --all-features -- --test-threads=1
      - name: Browser-session RPC lifecycle integration
        timeout-minutes: 5
        run: scripts/test-browser-session-lifecycle.sh
      - name: UI installation RPC integration
        timeout-minutes: 5
        run: scripts/test-ui-installation-rpc.sh
      - name: Deferred update admission and reconciler race
        timeout-minutes: 15
        env:
          CONTAINER_ENGINE: docker
        run: scripts/test-update-admission-postgres-nats.sh
      - name: Mélange doctor
        run: scripts/check-authz.sh
      - name: Documentation
        run: cargo doc --workspace --all-features --no-deps
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Prepare isolated Rust coverage services
        run: |
          set -Eeuo pipefail
          coverage_database="hephaestus_coverage_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}"
          postgres_url_without_query="${HEPHAESTUS_POSTGRES_TEST_URL%%\?*}"
          postgres_query_suffix=""
          if [[ "${HEPHAESTUS_POSTGRES_TEST_URL}" == *\?* ]]; then
            postgres_query_suffix="?${HEPHAESTUS_POSTGRES_TEST_URL#*\?}"
          fi
          postgres_authority="${postgres_url_without_query%/*}"
          coverage_maintenance_url="${postgres_authority}/postgres${postgres_query_suffix}"
          coverage_database_url="${postgres_authority}/${coverage_database}${postgres_query_suffix}"
          psql --no-psqlrc --set ON_ERROR_STOP=1 \
            --dbname "${coverage_maintenance_url}" \
            --command "CREATE DATABASE \"${coverage_database}\""
          docker run --detach --rm \
            --name hephaestus-nats-coverage \
            --publish 127.0.0.1:4223:4222 \
            docker.io/library/nats@sha256:e4bf19f15fd3218814a4e3c9e0064e1334bd8aa20d5984b9f1a0afd084f8cc00 \
            -js
          for attempt in $(seq 1 30); do
            if docker logs hephaestus-nats-coverage 2>&1 | grep -q 'Server is ready'; then
              break
            fi
            if [[ "${attempt}" == 30 ]]; then
              docker logs hephaestus-nats-coverage >&2 || true
              echo 'isolated coverage JetStream did not become ready' >&2
              exit 1
            fi
            sleep 1
          done
          {
            echo "HEPHAESTUS_POSTGRES_TEST_URL=${coverage_database_url}"
            echo 'HEPHAESTUS_NATS_TEST_URL=nats://127.0.0.1:4223'
          } >> "${GITHUB_ENV}"
      - name: Rust coverage
        id: rust_coverage
        run: |
          set -Eeuo pipefail
          mkdir -p coverage
          coverage_ignore_regex='crates/rpc-proto/src/generated/'
          cargo llvm-cov \
            --workspace \
            --all-features \
            --ignore-filename-regex "${coverage_ignore_regex}" \
            --html \
            --output-dir coverage/html \
            -- \
            --test-threads=1
          cargo llvm-cov report \
            --ignore-filename-regex "${coverage_ignore_regex}" \
            2>&1 | tee coverage/summary.txt
          cargo llvm-cov report \
            --ignore-filename-regex "${coverage_ignore_regex}" \
            --lcov \
            --output-path coverage/lcov.info
      - name: Aggregate Rust coverage by crate
        id: rust_coverage_summary
        if: ${{ steps.rust_coverage.outcome == 'success' }}
        run: |
          set -Eeuo pipefail
          python3 scripts/rust_coverage_summary.py \
            --lcov coverage/lcov.info \
            --csv coverage/rust-coverage-by-crate.csv \
            --markdown coverage/rust-coverage-by-crate.md
      - name: Retain Rust coverage reports
        id: upload_rust_coverage
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage
          if-no-files-found: warn
          retention-days: 7
      - name: Publish Rust coverage summary
        if: ${{ always() }}
        env:
          COVERAGE_OUTCOME: ${{ steps.rust_coverage.outcome }}
          COVERAGE_SUMMARY_OUTCOME: ${{ steps.rust_coverage_summary.outcome }}
          COVERAGE_ARTIFACT_URL: ${{ steps.upload_rust_coverage.outputs.artifact-url }}
        run: |
          {
            echo '## Rust coverage'
            echo
            echo "Result: \`${COVERAGE_OUTCOME}\`"
            echo "Per-crate summary: \`${COVERAGE_SUMMARY_OUTCOME}\`"
            echo
            if [[ -s coverage/summary.txt ]]; then
              echo '```text'
              tail -n 30 coverage/summary.txt
              echo '```'
            else
              echo 'No coverage summary was generated.'
            fi
            echo
            echo 'Scope: the root `crates/*` workspace with `--workspace --all-features` and serialized tests.'
            echo 'Focused integration scripts, doc tests, and standalone Cooking workspaces are outside this report.'
            if [[ -s coverage/rust-coverage-by-crate.md ]]; then
              cat coverage/rust-coverage-by-crate.md
            else
              echo 'No per-crate coverage table was generated.'
            fi
            if [[ -n "${COVERAGE_ARTIFACT_URL}" ]]; then
              echo "Coverage artifact: [download HTML and LCOV reports](${COVERAGE_ARTIFACT_URL})"
            else
              echo 'Coverage artifact URL unavailable.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Cleanup isolated Rust coverage services
        if: ${{ always() }}
        run: docker rm --force hephaestus-nats-coverage >/dev/null 2>&1 || true

  cooking-applications:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Install musl toolchain
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: Install musl target
        run: rustup target add x86_64-unknown-linux-musl
      - name: Test cooking gateway
        working-directory: examples/cooking/cooking-gateway
        run: |
          cargo test --locked --offline --all-features
          cargo build --locked --offline --release --target x86_64-unknown-linux-musl
      - name: Check cooking service
        working-directory: examples/cooking/cooking-service
        run: |
          cargo fmt --check
          cargo clippy --locked --offline --all-targets --all-features -- -D warnings
          cargo test --locked --offline --all-features
          cargo doc --locked --offline --all-features --no-deps
          cargo build --locked --offline --release --target x86_64-unknown-linux-musl
      - name: Test cooking agent, deterministic relay and Hugo output
        working-directory: examples/cooking/cooking-agent
        run: |
          set -Eeuo pipefail
          hugo_root="$(mktemp -d)"
          trap 'rm -rf -- "$hugo_root"' EXIT
          ../cooking-blog/verify-hugo.sh "$hugo_root/hugo"
          COOKING_HUGO_BINARY="$hugo_root/hugo" python3 -B -m unittest -v
      - name: Test reference session-chat Python release
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s examples/session-chat -p 'test_*.py' -v
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover \
            -s examples/session-chat/tests -p 'test_*.py' -v
      - name: Check cooking blog
        working-directory: examples/cooking/cooking-blog
        run: python3 check.py
      - name: Test browser evidence scanner
        run: python3 -m unittest discover -s scripts -p test_browser_evidence.py
      - name: Test trusted GCP controller evidence contracts
        run: |
          bash -n scripts/gcp-cooking-run.sh scripts/gcp-kvm-smoke.sh scripts/gcp-kvm-startup.sh
          python3 -m unittest scripts.test_gcp_browser_summary scripts.test_gcp_cooking_scenario scripts.test_gcp_cooking_failure_attribution scripts.test_gcp_diagnostics_pipeline scripts.test_gcp_failure_reporting scripts.test_gcp_quota_contract scripts.test_gcp_kvm_smoke_cleanup scripts.test_gcp_phase_timing scripts.test_gcp_runner_image scripts.test_gcp_runner_image_build scripts.test_gcp_runner_image_bundle scripts.test_gcp_runner_image_compatibility scripts.test_gcp_runner_image_validator scripts.test_libkrun_runtime_root

  live-review-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: e2e/playwright/package-lock.json
      - name: Install local runtime dependencies
        run: sudo apt-get update && sudo apt-get install -y e2fsprogs podman
      - name: Install browser and operating-system dependencies
        working-directory: e2e/playwright
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Test release UI kit
        working-directory: web/assets/release_ui_kit
        run: npm test
      - name: Installed UI navigation and bootstrap Node tests
        run: |
          node --test --test-isolation=none --test-reporter=tap \
            web/assets/js/design_system/hooks/installed_ui_navigation_test.mjs \
            crates/hephaestus-app/tests/ui_bootstrap_script.mjs \
            e2e/playwright/cooking-tests/session-chat-concurrent-parser.test.mjs \
            e2e/playwright/reporter-tests/safe-installed-ui-reporter.test.mjs
      - name: Installed UI bridge protocol
        run: scripts/test-ui-e2e-installed-bridge.sh
      - name: Installed UI browser startup diagnostics
        run: scripts/test-installed-ui-e2e-startup.sh
      - name: Installed UI browser prerequisite diagnostics
        run: scripts/test-installed-ui-browser-smoke.sh
      - name: Phoenix and browser golden path
        env:
          HEPHAESTUS_PLAYWRIGHT_SKIP_BROWSER_INSTALL: "1"
        run: scripts/run-ui-e2e.sh
