name: Cooking E2E

on:
  workflow_dispatch:
    inputs:
      cloud_mode:
        description: 'Read quota, build or use the immutable runner image, inspect the Cooking cache, triage a retained private diagnostics bundle, run the diagnostic VM, run the disposable smoke VM, run GCP Cooking, or run legacy Cooking'
        required: true
        type: choice
        options: [preflight, image-build, image-retire, cache-preflight, diagnostics-triage, diagnostic, smoke, gcp-cooking, cooking]
        default: preflight
      runner_image:
        description: 'Explicit immutable runner image name for diagnostic, smoke, GCP Cooking, or image retirement'
        required: false
        type: string
        default: ''
      use_stock_image:
        description: 'Force the stock Ubuntu image for diagnostic, smoke, or GCP Cooking (takes precedence over runner_image and the repository default)'
        required: false
        type: boolean
        default: false
      gcp_zone:
        description: 'GCE zone for the disposable smoke VM'
        required: true
        type: choice
        options: [europe-west1-b, europe-west1-c, europe-west1-d]
        default: europe-west1-b
      diagnostics_run_id:
        description: 'Historical GitHub Actions run ID for diagnostics-triage'
        required: false
        type: string
        default: ''
      diagnostics_attempt:
        description: 'Historical GitHub Actions run attempt for diagnostics-triage'
        required: false
        type: string
        default: ''
      diagnostics_sha:
        description: 'Exact 40-character main commit SHA for diagnostics-triage'
        required: false
        type: string
        default: ''
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ (github.event_name == 'workflow_dispatch' && inputs.cloud_mode != 'cooking') && format('gcp-kvm-smoke-{0}', github.repository) || format('cooking-kvm-{0}', github.repository) }}
  cancel-in-progress: false

jobs:
  gcp-cloud:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.cloud_mode != 'cooking' }}
    runs-on: ubuntu-latest
    timeout-minutes: 50
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - id: auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: projects/84572286146/locations/global/workloadIdentityPools/github-actions/providers/github
          service_account: hephaestus-ci@hephaestus-508000.iam.gserviceaccount.com
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db
        with:
          version: '>= 390.0.0'
      - name: Build or verify immutable runner image
        if: ${{ inputs.cloud_mode == 'image-build' }}
        env:
          GCP_ZONE: ${{ inputs.gcp_zone || 'europe-west1-d' }}
          GCP_RUNNER_IMAGE_STATE: ${{ runner.temp }}/gcp-runner-image-build-state
        run: bash scripts/gcp-runner-image-build.sh build
      - name: Retire one validated immutable runner image
        if: ${{ inputs.cloud_mode == 'image-retire' }}
        env:
          GCP_RETIRE_IMAGE: ${{ inputs.runner_image }}
          GCP_PROTECTED_CURRENT_IMAGE: ${{ vars.GCP_RUNNER_IMAGE }}
          GCP_PROTECTED_ROLLBACK_IMAGE: ${{ vars.GCP_RUNNER_ROLLBACK_IMAGE }}
        run: bash scripts/gcp-runner-image-retire.sh retire "$GCP_RETIRE_IMAGE"
      - name: Read quota or run disposable GCE KVM mode
        if: ${{ inputs.cloud_mode != 'image-build' && inputs.cloud_mode != 'image-retire' && inputs.cloud_mode != 'diagnostics-triage' }}
        env:
          GCP_ZONE: ${{ inputs.gcp_zone || 'europe-west1-b' }}
          GCP_RUNNER_IMAGE: ${{ inputs.runner_image || vars.GCP_RUNNER_IMAGE }}
          GCP_USE_STOCK_IMAGE: ${{ inputs.use_stock_image }}
          GCP_SMOKE_LOG: ${{ runner.temp }}/gcp-kvm-smoke.log
          GCP_DIAGNOSTICS_STATUS: ${{ runner.temp }}/gcp-diagnostics-status.json
        run: |
          set -Eeuo pipefail
          if [[ "$GCP_USE_STOCK_IMAGE" == true ]]; then
            unset GCP_RUNNER_IMAGE
          fi
          bash scripts/gcp-kvm-smoke.sh "${{ inputs.cloud_mode }}"
      - name: Download and triage selected private diagnostics without a VM
        if: ${{ inputs.cloud_mode == 'diagnostics-triage' }}
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GCP_ZONE: ${{ inputs.gcp_zone || 'europe-west1-b' }}
          GCP_DIAGNOSTICS_SOURCE_RUN_ID: ${{ inputs.diagnostics_run_id }}
          GCP_DIAGNOSTICS_SOURCE_ATTEMPT: ${{ inputs.diagnostics_attempt }}
          GCP_DIAGNOSTICS_SOURCE_SHA: ${{ inputs.diagnostics_sha }}
          GCP_DIAGNOSTICS_REQUIRE_SOURCE: 'true'
          GCP_DIAGNOSTICS_ARCHIVE: ${{ runner.temp }}/gcp-diagnostics.tar.gz
          GCP_DIAGNOSTICS_STATUS: ${{ runner.temp }}/gcp-diagnostics-status.json
        run: bash scripts/gcp-kvm-smoke.sh download-diagnostics
      - name: Cleanup immutable runner image build resources
        if: ${{ always() && inputs.cloud_mode == 'image-build' }}
        env:
          GCP_ZONE: ${{ inputs.gcp_zone || 'europe-west1-d' }}
          GCP_RUNNER_IMAGE_STATE: ${{ runner.temp }}/gcp-runner-image-build-state
        run: bash scripts/gcp-runner-image-build.sh cleanup
      - name: Cleanup disposable KVM VM
        if: ${{ always() && (inputs.cloud_mode == 'diagnostic' || inputs.cloud_mode == 'smoke' || inputs.cloud_mode == 'gcp-cooking') }}
        env:
          GCP_ZONE: ${{ inputs.gcp_zone || 'europe-west1-b' }}
        run: bash scripts/gcp-kvm-smoke.sh cleanup
      - name: Download and scan private diagnostics after VM deletion
        if: ${{ always() && (inputs.cloud_mode == 'diagnostic' || inputs.cloud_mode == 'smoke' || inputs.cloud_mode == 'gcp-cooking') }}
        env:
          GCP_ZONE: ${{ inputs.gcp_zone || 'europe-west1-b' }}
          GCP_DIAGNOSTICS_ARCHIVE: ${{ runner.temp }}/gcp-diagnostics.tar.gz
          GCP_DIAGNOSTICS_STATUS: ${{ runner.temp }}/gcp-diagnostics-status.json
        run: bash scripts/gcp-kvm-smoke.sh download-diagnostics
      - name: Retain safe diagnostics manifest
        if: ${{ always() && (inputs.cloud_mode == 'diagnostic' || inputs.cloud_mode == 'smoke' || inputs.cloud_mode == 'gcp-cooking' || inputs.cloud_mode == 'diagnostics-triage') }}
        uses: actions/upload-artifact@v4
        with:
          name: gcp-diagnostics-manifest-${{ inputs.diagnostics_run_id || github.run_id }}-${{ inputs.diagnostics_attempt || github.run_attempt }}
          path: ${{ runner.temp }}/gcp-diagnostics-status.json
          if-no-files-found: error
          retention-days: 1

  cooking:
    if: ${{ (github.event_name != 'workflow_dispatch' || inputs.cloud_mode == 'cooking') && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: [self-hosted, Linux, X64, heph-kvm]
    timeout-minutes: 30
    env:
      HEPHAESTUS_COOKING_RUNNER_ENV: ${{ vars.HEPHAESTUS_COOKING_RUNNER_ENV }}
    steps:
      - uses: actions/checkout@v4
      - name: Run real cooking builds, installation, faults and updates
        shell: bash
        run: |
          set -Eeuo pipefail
          : "${HEPHAESTUS_COOKING_RUNNER_ENV:?configure the reviewed KVM runner environment file}"
          [[ "$HEPHAESTUS_COOKING_RUNNER_ENV" = /* ]]
          [[ -f "$HEPHAESTUS_COOKING_RUNNER_ENV" && ! -L "$HEPHAESTUS_COOKING_RUNNER_ENV" ]]
          runner_profile="$(realpath -- "$HEPHAESTUS_COOKING_RUNNER_ENV")"
          checkout_root="$(realpath -- "$GITHUB_WORKSPACE")"
          case "$runner_profile" in
            "$checkout_root"|"$checkout_root"/*)
              printf 'The reviewed runner environment must be outside the checkout.\n' >&2
              exit 1
              ;;
          esac
          set -a
          source "$runner_profile"
          set +a
          export HEPHAESTUS_APP_COOKING_BUILD_PROOF=1
          export HEPHAESTUS_COOKING_UPDATE_E2E=1
          export HEPHAESTUS_COOKING_BROWSER_E2E=1
          export HEPHAESTUS_COOKING_SOURCE_ROOT="$GITHUB_WORKSPACE/examples/cooking"
          export HEPHAESTUS_COOKING_OCI_BASE_IMPORT_DIAGNOSTIC=0
          export HEPHAESTUS_APP_UPDATE_ADMISSION_E2E=0
          export HEPHAESTUS_APP_UPDATE_ADMISSION_RACE_E2E=0
          export HEPHAESTUS_COOKING_TIMEOUT_SECONDS=1500
          export HEPHAESTUS_COOKING_DIAGNOSTICS_DIR="$RUNNER_TEMP/cooking-e2e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          scripts/test-ui-e2e-host-bridge.sh
          examples/cooking/run.sh
      - name: Check retained evidence for fixture credentials
        id: evidence
        if: ${{ always() }}
        shell: bash
        run: |
          python3 -B scripts/check-browser-evidence.py \
            "$RUNNER_TEMP/cooking-e2e-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
      - name: Retain checked cooking diagnostics
        if: ${{ always() && steps.evidence.outcome == 'success' }}
        uses: actions/upload-artifact@v4
        with:
          name: cooking-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/cooking-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          retention-days: 7
