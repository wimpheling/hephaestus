syntax = "proto3";

package hephaestus.secret.v1;

import "google/protobuf/timestamp.proto";
import "hephaestus/common/v1/common.proto";
import "hephaestus/options/v1/options.proto";

service SecretService {
  rpc ListProjectSecrets(ListProjectSecretsRequest) returns (ListProjectSecretsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "secret.list"
      audience: "/hephaestus.secret.v1.SecretService/ListProjectSecrets"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 2097152;
  }
  rpc ListOrganizationSecrets(ListOrganizationSecretsRequest) returns (ListOrganizationSecretsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "secret.list"
      audience: "/hephaestus.secret.v1.SecretService/ListOrganizationSecrets"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 2097152;
  }
  rpc ListOrganizationSecretGrants(ListOrganizationSecretGrantsRequest) returns (ListOrganizationSecretGrantsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "secret_grant.list"
      audience: "/hephaestus.secret.v1.SecretService/ListOrganizationSecretGrants"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 2097152;
  }
  rpc GetProjectSecretAuthority(GetProjectSecretAuthorityRequest) returns (GetProjectSecretAuthorityResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "secret_authority.read"
      audience: "/hephaestus.secret.v1.SecretService/GetProjectSecretAuthority"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 4096;
    option (hephaestus.options.v1.max_response_bytes) = 2097152;
  }
  rpc CreateSecret(CreateSecretRequest) returns (CreateSecretResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "secret.create"
      audience: "/hephaestus.secret.v1.SecretService/CreateSecret"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 1048576;
    option (hephaestus.options.v1.max_response_bytes) = 4096;
  }
  rpc RotateSecret(RotateSecretRequest) returns (RotateSecretResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "secret.rotate"
      audience: "/hephaestus.secret.v1.SecretService/RotateSecret"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 1048576;
    option (hephaestus.options.v1.max_response_bytes) = 4096;
  }
  rpc RevokeSecret(RevokeSecretRequest) returns (RevokeSecretResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "secret.revoke"
      audience: "/hephaestus.secret.v1.SecretService/RevokeSecret"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 4096;
  }
  rpc SetSecretEnabled(SetSecretEnabledRequest) returns (SetSecretEnabledResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "secret.set_enabled"
      audience: "/hephaestus.secret.v1.SecretService/SetSecretEnabled"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 4096;
  }
  rpc PurgeSecret(PurgeSecretRequest) returns (PurgeSecretResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "secret.purge"
      audience: "/hephaestus.secret.v1.SecretService/PurgeSecret"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 4096;
  }
  rpc GrantSecret(GrantSecretRequest) returns (GrantSecretResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "secret_grant.create"
      audience: "/hephaestus.secret.v1.SecretService/GrantSecret"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 65536;
    option (hephaestus.options.v1.max_response_bytes) = 4096;
  }
  rpc AcceptSecretImport(AcceptSecretImportRequest) returns (AcceptSecretImportResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "secret_import.accept"
      audience: "/hephaestus.secret.v1.SecretService/AcceptSecretImport"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 16384;
    option (hephaestus.options.v1.max_response_bytes) = 4096;
  }
}

enum DeliveryMode {
  DELIVERY_MODE_UNSPECIFIED = 0;
  DELIVERY_MODE_RAW = 1;
  DELIVERY_MODE_BROKERED = 2;
}
enum DeliveryPhase {
  DELIVERY_PHASE_UNSPECIFIED = 0;
  DELIVERY_PHASE_NORMAL = 1;
  DELIVERY_PHASE_UPDATE = 2;
}
enum SecretState {
  SECRET_STATE_UNSPECIFIED = 0;
  SECRET_STATE_ACTIVE = 1;
  SECRET_STATE_DISABLED = 2;
  SECRET_STATE_REVOKED = 3;
  SECRET_STATE_PURGED = 4;
}
enum AuthorityState {
  AUTHORITY_STATE_UNSPECIFIED = 0;
  AUTHORITY_STATE_ACTIVE = 1;
  AUTHORITY_STATE_REVOKED = 2;
  AUTHORITY_STATE_EXPIRED = 3;
}

message SecretOwner {
  oneof owner {
    hephaestus.common.v1.OpaqueId organization_id = 1;
    hephaestus.common.v1.OpaqueId project_id = 2;
  }
}
message SecretTarget {
  oneof target {
    hephaestus.common.v1.OpaqueId project_id = 1;
    hephaestus.common.v1.OpaqueId repository_id = 2;
  }
}
message SecretValue {
  bytes value = 1 [(hephaestus.options.v1.sensitive) = true];
}
message SecretPolicy {
  repeated DeliveryMode delivery_modes = 1;
  repeated DeliveryPhase phases = 2;
  repeated string destinations = 3;
}
message SecretLastUse {
  string operation = 1;
  string outcome = 2;
  DeliveryMode delivery_mode = 3;
  google.protobuf.Timestamp occurred_at = 4;
}
message SecretSummary {
  hephaestus.common.v1.OpaqueId id = 1;
  string name = 2;
  SecretState state = 3;
  repeated DeliveryMode allowed_delivery_modes = 4;
  hephaestus.common.v1.OpaqueId active_version_id = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  int64 active_version_sequence = 8;
  google.protobuf.Timestamp active_version_created_at = 9;
  int64 grant_count = 10;
  int64 import_count = 11;
  int64 binding_count = 12;
  bool has_raw_binding = 13;
  bool can_rotate = 14;
  bool can_manage_grants = 15;
  bool can_revoke = 16;
  bool can_purge = 17;
  SecretLastUse last_use = 18;
}
message GrantSummary {
  hephaestus.common.v1.OpaqueId id = 1;
  hephaestus.common.v1.OpaqueId secret_id = 2;
  string secret_name = 3;
  SecretTarget target = 4;
  string target_name = 5;
  SecretPolicy policy = 6;
  google.protobuf.Timestamp expires_at = 7;
  AuthorityState state = 8;
  google.protobuf.Timestamp created_at = 9;
  int64 import_count = 10;
  hephaestus.common.v1.OpaqueId import_id = 11;
  string import_alias = 12;
  AuthorityState import_state = 13;
}
message ImportSummary {
  hephaestus.common.v1.OpaqueId id = 1;
  string alias = 2;
  SecretTarget target = 3;
  AuthorityState state = 4;
  hephaestus.common.v1.OpaqueId secret_id = 5;
  string secret_name = 6;
  SecretState secret_state = 7;
  SecretPolicy policy = 8;
  google.protobuf.Timestamp expires_at = 9;
}

message ListProjectSecretsRequest {
  hephaestus.common.v1.OpaqueId project_id = 1;
  hephaestus.common.v1.PageRequest page = 2;
}
message ListProjectSecretsResponse {
  repeated SecretSummary secrets = 1;
  hephaestus.common.v1.PageResponse page = 2;
}
message ListOrganizationSecretsRequest {
  hephaestus.common.v1.OpaqueId organization_id = 1;
  hephaestus.common.v1.PageRequest page = 2;
}
message ListOrganizationSecretsResponse {
  repeated SecretSummary secrets = 1;
  hephaestus.common.v1.PageResponse page = 2;
}
message ListOrganizationSecretGrantsRequest {
  hephaestus.common.v1.OpaqueId organization_id = 1;
  hephaestus.common.v1.PageRequest page = 2;
}
message ListOrganizationSecretGrantsResponse {
  repeated GrantSummary grants = 1;
  hephaestus.common.v1.PageResponse page = 2;
}
message GetProjectSecretAuthorityRequest {
  hephaestus.common.v1.OpaqueId project_id = 1;
  hephaestus.common.v1.PageRequest grants_page = 2;
  hephaestus.common.v1.PageRequest imports_page = 3;
}
message GetProjectSecretAuthorityResponse {
  repeated GrantSummary grants = 1;
  repeated ImportSummary imports = 2;
  hephaestus.common.v1.PageResponse grants_page = 3;
  hephaestus.common.v1.PageResponse imports_page = 4;
}

message CreateSecretRequest {
  hephaestus.common.v1.RequestContext context = 1;
  SecretOwner owner = 2;
  string name = 3;
  repeated DeliveryMode allowed_delivery_modes = 4;
  SecretValue secret = 5;
}
message CreateSecretResponse {
  hephaestus.common.v1.OpaqueId secret_id = 1;
  hephaestus.common.v1.OpaqueId version_id = 2;
  hephaestus.common.v1.MutationReceipt receipt = 3;
}
message RotateSecretRequest {
  hephaestus.common.v1.RequestContext context = 1;
  hephaestus.common.v1.OpaqueId secret_id = 2;
  hephaestus.common.v1.OpaqueId expected_active_version_id = 3;
  SecretValue secret = 4;
}
message RotateSecretResponse {
  hephaestus.common.v1.OpaqueId secret_id = 1;
  hephaestus.common.v1.OpaqueId version_id = 2;
  hephaestus.common.v1.MutationReceipt receipt = 3;
}
message RevokeSecretRequest {
  hephaestus.common.v1.RequestContext context = 1;
  hephaestus.common.v1.OpaqueId secret_id = 2;
}
message SetSecretEnabledRequest {
  hephaestus.common.v1.RequestContext context = 1;
  hephaestus.common.v1.OpaqueId secret_id = 2;
  bool enabled = 3;
}
message PurgeSecretRequest {
  hephaestus.common.v1.RequestContext context = 1;
  hephaestus.common.v1.OpaqueId secret_id = 2;
}
message RevokeSecretResponse {
  hephaestus.common.v1.OpaqueId secret_id = 1;
  SecretState state = 2;
  hephaestus.common.v1.MutationReceipt receipt = 3;
}
message SetSecretEnabledResponse {
  hephaestus.common.v1.OpaqueId secret_id = 1;
  SecretState state = 2;
  hephaestus.common.v1.MutationReceipt receipt = 3;
}
message PurgeSecretResponse {
  hephaestus.common.v1.OpaqueId secret_id = 1;
  SecretState state = 2;
  hephaestus.common.v1.MutationReceipt receipt = 3;
}
message GrantSecretRequest {
  hephaestus.common.v1.RequestContext context = 1;
  hephaestus.common.v1.OpaqueId secret_id = 2;
  SecretTarget target = 3;
  SecretPolicy policy = 4;
  google.protobuf.Timestamp expires_at = 5;
}
message GrantSecretResponse {
  hephaestus.common.v1.OpaqueId grant_id = 1;
  hephaestus.common.v1.MutationReceipt receipt = 2;
}
message AcceptSecretImportRequest {
  hephaestus.common.v1.RequestContext context = 1;
  hephaestus.common.v1.OpaqueId grant_id = 2;
  SecretTarget target = 3;
  string alias = 4;
}
message AcceptSecretImportResponse {
  hephaestus.common.v1.OpaqueId import_id = 1;
  hephaestus.common.v1.MutationReceipt receipt = 2;
}
