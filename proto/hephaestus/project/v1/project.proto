syntax = "proto3";

package hephaestus.project.v1;

import "google/protobuf/timestamp.proto";
import "hephaestus/common/v1/common.proto";
import "hephaestus/options/v1/options.proto";

service ProjectService {
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "project.read"
      audience: "/hephaestus.project.v1.ProjectService/GetProject"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 4096;
    option (hephaestus.options.v1.max_response_bytes) = 65536;
  }
  rpc ListProjectRepositories(ListProjectRepositoriesRequest) returns (ListProjectRepositoriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "repository.list"
      audience: "/hephaestus.project.v1.ProjectService/ListProjectRepositories"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 1048576;
  }
  rpc ListProjectInstances(ListProjectInstancesRequest) returns (ListProjectInstancesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "instance.list"
      audience: "/hephaestus.project.v1.ProjectService/ListProjectInstances"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 2097152;
  }
  rpc ListImportableReleaseAgents(ListImportableReleaseAgentsRequest) returns (ListImportableReleaseAgentsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "release_agent.list_importable"
      audience: "/hephaestus.project.v1.ProjectService/ListImportableReleaseAgents"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 2097152;
  }
}

message Project {
  hephaestus.common.v1.OpaqueId id = 1;
  string name = 2;
  hephaestus.common.v1.OpaqueId organization_id = 3;
  string organization_name = 4;
}

message ProjectRepository {
  hephaestus.common.v1.OpaqueId id = 1;
  string name = 2;
  string default_branch = 3;
  bool is_public = 4;
  int64 attachment_count = 5;
  int64 run_count = 6;
}

message InstanceSummary {
  hephaestus.common.v1.OpaqueId id = 1;
  string name = 2;
  string state = 3;
  bool run_gate_open = 4;
  hephaestus.common.v1.OpaqueId active_revision_id = 5;
  optional hephaestus.common.v1.OpaqueId state_volume_id = 6;
  google.protobuf.Timestamp updated_at = 7;
  bool runnable = 8;
  string platform_policy_version = 9;
  repeated hephaestus.common.v1.Diagnostic diagnostics = 10;
  hephaestus.common.v1.OpaqueId release_id = 11;
  string release_version = 12;
  string release_state = 13;
  string release_agent_name = 14;
  int64 attachment_count = 15;
  int64 run_count = 16;
  optional google.protobuf.Timestamp last_run_at = 17;
}

message ReleaseAgentOption {
  hephaestus.common.v1.OpaqueId id = 1;
  string display_name = 2;
  repeated hephaestus.common.v1.ParameterDeclaration parameter_schema = 3;
  repeated hephaestus.common.v1.SecretSlotDeclaration secret_slot_schema = 4;
  hephaestus.common.v1.RuntimeContract runtime_contract = 5;
  bool requires_state = 6;
  hephaestus.common.v1.OpaqueId release_id = 7;
  string release_version = 8;
  string source_commit = 9;
  hephaestus.common.v1.OpaqueId repository_id = 10;
  string repository_name = 11;
}

message GetProjectRequest {
  hephaestus.common.v1.OpaqueId project_id = 1;
}
message GetProjectResponse {
  Project project = 1;
}
message ListProjectRepositoriesRequest {
  hephaestus.common.v1.OpaqueId project_id = 1;
  hephaestus.common.v1.PageRequest page = 2;
}
message ListProjectRepositoriesResponse {
  repeated ProjectRepository repositories = 1;
  hephaestus.common.v1.PageResponse page = 2;
}
message ListProjectInstancesRequest {
  hephaestus.common.v1.OpaqueId project_id = 1;
  hephaestus.common.v1.PageRequest page = 2;
}
message ListProjectInstancesResponse {
  repeated InstanceSummary instances = 1;
  hephaestus.common.v1.PageResponse page = 2;
}
message ListImportableReleaseAgentsRequest {
  hephaestus.common.v1.OpaqueId project_id = 1;
  hephaestus.common.v1.PageRequest page = 2;
}
message ListImportableReleaseAgentsResponse {
  repeated ReleaseAgentOption release_agents = 1;
  hephaestus.common.v1.PageResponse page = 2;
}
