syntax = "proto3";

package hephaestus.project.v1;

import "google/protobuf/timestamp.proto";
import "hephaestus/common/v1/common.proto";
import "hephaestus/instance/v1/instance.proto";
import "hephaestus/options/v1/options.proto";

service ProjectService {
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "project.create"
      audience: "/hephaestus.project.v1.ProjectService/CreateProject"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 4096;
  }
  rpc GetProject(GetProjectRequest) returns (GetProjectResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "project.read"
      audience: "/hephaestus.project.v1.ProjectService/GetProject"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 4096;
    option (hephaestus.options.v1.max_response_bytes) = 65536;
  }
  // Inspects persisted recipe progress; it neither activates nor starts a Run.
  rpc GetRecipeDeployment(GetRecipeDeploymentRequest) returns (GetRecipeDeploymentResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "project.read"
      audience: "/hephaestus.project.v1.ProjectService/GetRecipeDeployment"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 4096;
    option (hephaestus.options.v1.max_response_bytes) = 65536;
  }
  rpc ListProjectRepositories(ListProjectRepositoriesRequest) returns (ListProjectRepositoriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "repository.list"
      audience: "/hephaestus.project.v1.ProjectService/ListProjectRepositories"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 1048576;
  }
  rpc ListProjectRepositoryImages(ListProjectRepositoryImagesRequest) returns (ListProjectRepositoryImagesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "project.read"
      audience: "/hephaestus.project.v1.ProjectService/ListProjectRepositoryImages"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 1048576;
  }
  rpc GetProjectRepositoryImage(GetProjectRepositoryImageRequest) returns (GetProjectRepositoryImageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "project.read"
      audience: "/hephaestus.project.v1.ProjectService/GetProjectRepositoryImage"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 4096;
    option (hephaestus.options.v1.max_response_bytes) = 65536;
  }
  rpc RetryProjectRepositoryImage(RetryProjectRepositoryImageRequest) returns (RetryProjectRepositoryImageResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "repository_image.retry"
      audience: "/hephaestus.project.v1.ProjectService/RetryProjectRepositoryImage"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 4096;
    option (hephaestus.options.v1.max_response_bytes) = 4096;
  }
  rpc ListProjectInstances(ListProjectInstancesRequest) returns (ListProjectInstancesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "instance.list"
      audience: "/hephaestus.project.v1.ProjectService/ListProjectInstances"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 2097152;
  }
  rpc ListImportableReleaseAgents(ListImportableReleaseAgentsRequest) returns (ListImportableReleaseAgentsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "release_agent.list_importable"
      audience: "/hephaestus.project.v1.ProjectService/ListImportableReleaseAgents"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 2097152;
  }
}

message CreateProjectRequest {
  hephaestus.common.v1.RequestContext context = 1;
  hephaestus.common.v1.OpaqueId organization_id = 2;
  string name = 3;
  string description = 4;
}
message CreateProjectResponse {
  hephaestus.common.v1.OpaqueId project_id = 1;
  hephaestus.common.v1.MutationReceipt receipt = 2;
}

message Project {
  hephaestus.common.v1.OpaqueId id = 1;
  string name = 2;
  hephaestus.common.v1.OpaqueId organization_id = 3;
  string organization_name = 4;
  string description = 5;
}

message ProjectRepository {
  hephaestus.common.v1.OpaqueId id = 1;
  string name = 2;
  string default_branch = 3;
  bool is_public = 4;
  int64 attachment_count = 5;
  int64 run_count = 6;
}

// A redacted project-owned OCI image resource. Evidence references and private
// operational paths are intentionally excluded from the project UI contract.
message ProjectRepositoryImage {
  hephaestus.common.v1.OpaqueId id = 1;
  hephaestus.common.v1.OpaqueId repository_id = 2;
  string key = 3;
  string display_name = 4;
  string source_revision = 5;
  string base_image_reference = 6;
  string status = 7;
  string image_reference = 8;
  string failure_reason = 9;
  google.protobuf.Timestamp updated_at = 10;
}

// One redacted immutable preparation transition. This is deliberately a
// bounded audit view, not raw VM output or a filesystem/log transport.
message ProjectRepositoryImagePreparationEvent {
  string phase = 1;
  string outcome = 2;
  string output_digest = 3;
  string safe_reason = 4;
  google.protobuf.Timestamp occurred_at = 5;
}

message InstanceSummary {
  hephaestus.common.v1.OpaqueId id = 1;
  string name = 2;
  string state = 3;
  bool run_gate_open = 4;
  hephaestus.common.v1.OpaqueId active_revision_id = 5;
  optional hephaestus.common.v1.OpaqueId state_volume_id = 6;
  google.protobuf.Timestamp updated_at = 7;
  bool runnable = 8;
  string platform_policy_version = 9;
  repeated hephaestus.common.v1.Diagnostic diagnostics = 10;
  hephaestus.common.v1.OpaqueId release_id = 11;
  string release_version = 12;
  string release_state = 13;
  string release_agent_name = 14;
  int64 attachment_count = 15;
  int64 run_count = 16;
  optional google.protobuf.Timestamp last_run_at = 17;
  // Current non-removed mailbox owned by this instance, when allocated.
  optional hephaestus.common.v1.OpaqueId mailbox_id = 18;
}

message ReleaseAgentOption {
  hephaestus.common.v1.OpaqueId id = 1;
  string display_name = 2;
  repeated hephaestus.common.v1.ParameterDeclaration parameter_schema = 3;
  repeated hephaestus.common.v1.SecretSlotDeclaration secret_slot_schema = 4;
  hephaestus.common.v1.RuntimeContract runtime_contract = 5;
  bool requires_state = 6;
  hephaestus.common.v1.OpaqueId release_id = 7;
  string release_version = 8;
  string source_commit = 9;
  hephaestus.common.v1.OpaqueId repository_id = 10;
  string repository_name = 11;
  repeated hephaestus.instance.v1.CapabilityRequirement capability_requirements = 12;
}

message GetProjectRequest {
  hephaestus.common.v1.OpaqueId project_id = 1;
}
message GetProjectResponse {
  Project project = 1;
}
message ListProjectRepositoriesRequest {
  hephaestus.common.v1.OpaqueId project_id = 1;
  hephaestus.common.v1.PageRequest page = 2;
}
message ListProjectRepositoriesResponse {
  repeated ProjectRepository repositories = 1;
  hephaestus.common.v1.PageResponse page = 2;
}
message ListProjectRepositoryImagesRequest {
  hephaestus.common.v1.OpaqueId project_id = 1;
  hephaestus.common.v1.PageRequest page = 2;
}
message ListProjectRepositoryImagesResponse {
  repeated ProjectRepositoryImage images = 1;
  hephaestus.common.v1.PageResponse page = 2;
}
message GetProjectRepositoryImageRequest {
  hephaestus.common.v1.OpaqueId image_id = 1;
  hephaestus.common.v1.PageRequest page = 2;
}
message GetProjectRepositoryImageResponse {
  ProjectRepositoryImage image = 1;
  repeated ProjectRepositoryImagePreparationEvent history = 2;
  hephaestus.common.v1.PageResponse page = 3;
}
message RetryProjectRepositoryImageRequest {
  hephaestus.common.v1.RequestContext context = 1;
  hephaestus.common.v1.OpaqueId image_id = 2;
}
message RetryProjectRepositoryImageResponse {
  ProjectRepositoryImage image = 1;
  hephaestus.common.v1.MutationReceipt receipt = 2;
}
message ListProjectInstancesRequest {
  hephaestus.common.v1.OpaqueId project_id = 1;
  hephaestus.common.v1.PageRequest page = 2;
}
message ListProjectInstancesResponse {
  repeated InstanceSummary instances = 1;
  hephaestus.common.v1.PageResponse page = 2;
}
message ListImportableReleaseAgentsRequest {
  hephaestus.common.v1.OpaqueId project_id = 1;
  hephaestus.common.v1.PageRequest page = 2;
}
message ListImportableReleaseAgentsResponse {
  repeated ReleaseAgentOption release_agents = 1;
  hephaestus.common.v1.PageResponse page = 2;
}

enum RecipeDeploymentLifecycle {
  RECIPE_DEPLOYMENT_LIFECYCLE_UNSPECIFIED = 0;
  RECIPE_DEPLOYMENT_LIFECYCLE_INSTALLING = 1;
  RECIPE_DEPLOYMENT_LIFECYCLE_INSTALLED = 2;
  RECIPE_DEPLOYMENT_LIFECYCLE_REMOVING = 3;
  RECIPE_DEPLOYMENT_LIFECYCLE_REMOVED = 4;
  RECIPE_DEPLOYMENT_LIFECYCLE_RECOVERY_REQUIRED = 5;
}

enum RecipeResourceKind {
  RECIPE_RESOURCE_KIND_UNSPECIFIED = 0;
  RECIPE_RESOURCE_KIND_VOLUME = 1;
  RECIPE_RESOURCE_KIND_INSTANCE = 2;
}

enum RecipeResourceOwnership {
  RECIPE_RESOURCE_OWNERSHIP_UNSPECIFIED = 0;
  RECIPE_RESOURCE_OWNERSHIP_OWNED = 1;
  RECIPE_RESOURCE_OWNERSHIP_EXTERNAL = 2;
}

enum RecipeInstallProgress {
  RECIPE_INSTALL_PROGRESS_UNSPECIFIED = 0;
  RECIPE_INSTALL_PROGRESS_PENDING = 1;
  RECIPE_INSTALL_PROGRESS_CREATING = 2;
  RECIPE_INSTALL_PROGRESS_READY = 3;
  RECIPE_INSTALL_PROGRESS_FAILED = 4;
  RECIPE_INSTALL_PROGRESS_RECOVERY_REQUIRED = 5;
}

enum RecipeRemovalProgress {
  RECIPE_REMOVAL_PROGRESS_UNSPECIFIED = 0;
  RECIPE_REMOVAL_PROGRESS_PENDING = 1;
  RECIPE_REMOVAL_PROGRESS_DRAINING = 2;
  RECIPE_REMOVAL_PROGRESS_DETACHED = 3;
  RECIPE_REMOVAL_PROGRESS_RETAINED = 4;
  RECIPE_REMOVAL_PROGRESS_DELETED = 5;
  RECIPE_REMOVAL_PROGRESS_RECOVERY_REQUIRED = 6;
}

enum RecipeProgressDiagnostic {
  RECIPE_PROGRESS_DIAGNOSTIC_UNSPECIFIED = 0;
  RECIPE_PROGRESS_DIAGNOSTIC_PROVIDER_FAILURE = 1;
  RECIPE_PROGRESS_DIAGNOSTIC_PROVIDER_OUTCOME_UNKNOWN = 2;
  RECIPE_PROGRESS_DIAGNOSTIC_DEPENDENCY_UNAVAILABLE = 3;
  RECIPE_PROGRESS_DIAGNOSTIC_AUTHORIZATION_CHANGED = 4;
  RECIPE_PROGRESS_DIAGNOSTIC_DRAIN_PENDING = 5;
  RECIPE_PROGRESS_DIAGNOSTIC_FENCING_UNPROVEN = 6;
  RECIPE_PROGRESS_DIAGNOSTIC_INTENT_CONFLICT = 7;
}

enum RecipeActivationObservation {
  RECIPE_ACTIVATION_OBSERVATION_UNSPECIFIED = 0;
  RECIPE_ACTIVATION_OBSERVATION_UNOBSERVED = 1;
}

message GetRecipeDeploymentRequest {
  hephaestus.common.v1.OpaqueId project_id = 1;
  hephaestus.common.v1.OpaqueId deployment_id = 2;
}
message GetRecipeDeploymentResponse {
  RecipeDeployment deployment = 1;
}
// No declaration, parameters, preparation, host paths, credentials or provider handles.
message RecipeDeployment {
  hephaestus.common.v1.OpaqueId id = 1;
  hephaestus.common.v1.OpaqueId project_id = 2;
  string key = 3;
  uint64 version = 4;
  RecipeDeploymentLifecycle lifecycle = 5;
  repeated RecipeDeploymentResource resources = 6;
  // Ledger Ready/Installed is not an activation or guest-running observation.
  RecipeActivationObservation activation = 7;
}
message RecipeDeploymentResource {
  string name = 1;
  RecipeResourceKind kind = 2;
  hephaestus.common.v1.OpaqueId resource_id = 3;
  // Present only for an instance's original immutable revision.
  hephaestus.common.v1.OpaqueId revision_id = 4;
  RecipeResourceOwnership ownership = 5;
  RecipeInstallProgress install = 6;
  RecipeRemovalProgress removal = 7;
  uint64 version = 8;
  hephaestus.common.v1.OpaqueId active_attempt_id = 9;
  // UNSPECIFIED means no recorded diagnostic; values are a closed safe vocabulary.
  RecipeProgressDiagnostic diagnostic = 10;
  // Exactly the persisted install/removal RecoveryRequired states, not authority.
  bool recovery_required = 11;
}
