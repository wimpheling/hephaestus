syntax = "proto3";

package hephaestus.gateway.v1;

import "google/protobuf/timestamp.proto";
import "hephaestus/common/v1/common.proto";
import "hephaestus/options/v1/options.proto";

// Project-scoped management, redacted ingress inspection, and explicitly
// opted-in application output for repository gateways. Ingress inspection
// remains value-free; application-emitted log bytes require app-owned
// redaction, and the platform does not promise universal secret detection.
service GatewayService {
  rpc ListProjectGateways(ListProjectGatewaysRequest) returns (ListProjectGatewaysResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "gateway.list"
      audience: "/hephaestus.gateway.v1.GatewayService/ListProjectGateways"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 1048576;
  }
  rpc GetGateway(GetGatewayRequest) returns (GetGatewayResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "gateway.read"
      audience: "/hephaestus.gateway.v1.GatewayService/GetGateway"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 4096;
    option (hephaestus.options.v1.max_response_bytes) = 1048576;
  }
  // Installs the gateway declarations from one published release's exact
  // repository commit. The manifest is resolved by the service and is never
  // supplied by a caller.
  rpc InstallReleaseGateways(InstallReleaseGatewaysRequest) returns (InstallReleaseGatewaysResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "gateway.install"
      audience: "/hephaestus.gateway.v1.GatewayService/InstallReleaseGateways"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 1048576;
  }
  // Creates one immutable runtime revision from the currently active
  // published declaration. Runtime values and secret versions are selected
  // explicitly; source declarations remain release owned.
  rpc ConfigureGateway(ConfigureGatewayRequest) returns (ConfigureGatewayResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "gateway.configure"
      audience: "/hephaestus.gateway.v1.GatewayService/ConfigureGateway"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 32768;
    option (hephaestus.options.v1.max_response_bytes) = 8192;
  }
  rpc ListGatewayIngress(ListGatewayIngressRequest) returns (ListGatewayIngressResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "gateway.ingress.list"
      audience: "/hephaestus.gateway.v1.GatewayService/ListGatewayIngress"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 1048576;
  }
  rpc SetGatewayLifecycle(SetGatewayLifecycleRequest) returns (SetGatewayLifecycleResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "gateway.lifecycle.set"
      audience: "/hephaestus.gateway.v1.GatewayService/SetGatewayLifecycle"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 4096;
  }
  // Binds one immutable, declared gateway revision slot to exactly one
  // same-project mailbox and creates its separately revocable publish grant.
  rpc CreateMailboxBinding(CreateMailboxBindingRequest) returns (CreateMailboxBindingResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "gateway.mailbox_binding.create"
      audience: "/hephaestus.gateway.v1.GatewayService/CreateMailboxBinding"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 8192;
  }
  // Revokes an active gateway mailbox publish grant without deleting its
  // immutable binding or redacted provenance.
  rpc RevokeMailboxBindingGrant(RevokeMailboxBindingGrantRequest) returns (RevokeMailboxBindingGrantResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "gateway.mailbox_binding.revoke"
      audience: "/hephaestus.gateway.v1.GatewayService/RevokeMailboxBindingGrant"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 8192;
  }
  // Lists value-free mailbox bindings and their grant lifecycle for one
  // readable gateway revision.
  rpc ListMailboxBindings(ListMailboxBindingsRequest) returns (ListMailboxBindingsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "gateway.mailbox_binding.list"
      audience: "/hephaestus.gateway.v1.GatewayService/ListMailboxBindings"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 1048576;
  }
  // Lists value-free publication provenance for one readable gateway.
  rpc ListMailboxPublications(ListMailboxPublicationsRequest) returns (ListMailboxPublicationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "gateway.mailbox_publication.list"
      audience: "/hephaestus.gateway.v1.GatewayService/ListMailboxPublications"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 1048576;
  }
}

enum GatewayLifecycle {
  GATEWAY_LIFECYCLE_UNSPECIFIED = 0;
  GATEWAY_LIFECYCLE_ENABLED = 1;
  GATEWAY_LIFECYCLE_PAUSED = 2;
  GATEWAY_LIFECYCLE_REMOVED = 3;
}

enum GatewayIngressOutcome {
  GATEWAY_INGRESS_OUTCOME_UNSPECIFIED = 0;
  GATEWAY_INGRESS_OUTCOME_ACCEPTED = 1;
  GATEWAY_INGRESS_OUTCOME_COMPLETED = 2;
  GATEWAY_INGRESS_OUTCOME_FAILED = 3;
  GATEWAY_INGRESS_OUTCOME_TIMED_OUT = 4;
  GATEWAY_INGRESS_OUTCOME_REJECTED = 5;
}

enum GatewayServiceLogStream {
  GATEWAY_SERVICE_LOG_STREAM_UNSPECIFIED = 0;
  GATEWAY_SERVICE_LOG_STREAM_STDOUT = 1;
  GATEWAY_SERVICE_LOG_STREAM_STDERR = 2;
}

message GatewayRoute {
  hephaestus.common.v1.OpaqueId id = 1;
  string path = 2;
  repeated string methods = 3;
  bool enabled = 4;
}

message GatewayRevision {
  hephaestus.common.v1.OpaqueId id = 1;
  hephaestus.common.v1.OpaqueId release_id = 2;
  string handler_contract = 3;
  string exposure = 4;
  repeated string secret_slots = 5;
  google.protobuf.Timestamp created_at = 6;
  repeated GatewayRoute routes = 7;
  // Exact published agent identity that produced this immutable revision.
  hephaestus.common.v1.OpaqueId release_agent_id = 8;
  // Symbolic mailbox slots declared by the published gateway manifest.
  repeated string mailbox_slots = 9;
}

message GatewaySummary {
  hephaestus.common.v1.OpaqueId id = 1;
  hephaestus.common.v1.OpaqueId project_id = 2;
  hephaestus.common.v1.OpaqueId repository_id = 3;
  string name = 4;
  GatewayLifecycle lifecycle = 5;
  hephaestus.common.v1.OpaqueId active_revision_id = 6;
  google.protobuf.Timestamp updated_at = 7;
  // Latest declared HTTP service revision. It may be pending readiness and
  // therefore differ from active_revision_id, which is the serving revision.
  hephaestus.common.v1.OpaqueId desired_service_revision_id = 8;
}

message GatewayIngress {
  hephaestus.common.v1.OpaqueId id = 1;
  hephaestus.common.v1.OpaqueId gateway_revision_id = 2;
  hephaestus.common.v1.OpaqueId gateway_route_id = 3;
  GatewayIngressOutcome outcome = 4;
  google.protobuf.Timestamp accepted_at = 5;
  optional google.protobuf.Timestamp completed_at = 6;
}

// Exact immutable scope for one persistent service log epoch. The reader
// validates every field together; callers must not infer scope from one ID.
// Fencing tokens are positive and must fit a signed 64-bit database value.
message GatewayServiceLogScope {
  hephaestus.common.v1.OpaqueId project_id = 1;
  hephaestus.common.v1.OpaqueId gateway_id = 2;
  hephaestus.common.v1.OpaqueId revision_id = 3;
  hephaestus.common.v1.OpaqueId instance_id = 4;
  uint64 fencing_token = 5;
}

message GatewayServiceLogRecord {
  uint64 sequence = 1;
  GatewayServiceLogStream stream = 2;
  google.protobuf.Timestamp observed_at = 3;
  google.protobuf.Timestamp stored_at = 4;
  // Raw application output is opt-in and each chunk is at most 64 KiB. A page
  // contains at most 512 KiB of contents. The application owner is
  // responsible for redaction; the platform does not guarantee arbitrary
  // secret detection and never places these bytes in errors or diagnostics.
  bytes contents = 5;
}

message GatewayServiceLogMetadata {
  bool epoch_present = 1;
  optional uint64 acknowledged_through = 2;
  uint64 retained_bytes = 3;
  uint64 retained_chunks = 4;
  uint64 producer_dropped_chunks = 5;
  uint64 producer_dropped_bytes = 6;
  uint64 provider_lagged_events = 7;
  uint64 storage_dropped_chunks = 8;
  uint64 storage_dropped_bytes = 9;
  uint64 evicted_chunks = 10;
  uint64 evicted_bytes = 11;
  optional uint64 earliest_retained_sequence = 12;
}

// Redacted immutable binding metadata. Neither mailbox event bodies nor
// guest/runtime credentials are represented by this API.
message GatewayMailboxBinding {
  hephaestus.common.v1.OpaqueId id = 1;
  hephaestus.common.v1.OpaqueId gateway_revision_id = 2;
  hephaestus.common.v1.OpaqueId mailbox_id = 3;
  string slot_key = 4;
  string producer_id = 5;
  hephaestus.common.v1.OpaqueId grant_id = 6;
  string grant_status = 7;
  google.protobuf.Timestamp created_at = 8;
  google.protobuf.Timestamp granted_at = 9;
  optional google.protobuf.Timestamp revoked_at = 10;
}

// Value-free, joined provenance from a gateway invocation through its exact
// authorization snapshot, mailbox delivery, and most recent run. Neither the
// event envelope nor request, credential, or guest data is represented here.
message GatewayMailboxPublication {
  hephaestus.common.v1.OpaqueId id = 1;
  hephaestus.common.v1.OpaqueId invocation_id = 2;
  hephaestus.common.v1.OpaqueId gateway_revision_id = 3;
  optional hephaestus.common.v1.OpaqueId binding_id = 4;
  optional hephaestus.common.v1.OpaqueId grant_id = 5;
  optional hephaestus.common.v1.OpaqueId mailbox_id = 6;
  optional hephaestus.common.v1.OpaqueId event_id = 7;
  string slot_key = 8;
  string outcome = 9;
  google.protobuf.Timestamp accepted_at = 10;
  google.protobuf.Timestamp settled_at = 11;
  // The immutable gateway authorization snapshot selected for the invocation.
  optional hephaestus.common.v1.OpaqueId authorization_snapshot_id = 12;
  // The exact immutable mailbox-binding copy within that snapshot.
  optional uint32 snapshot_binding_ordinal = 13;
  // Current or terminal durable delivery state for the accepted event.
  string delivery_disposition = 14;
  uint32 delivery_attempt_count = 15;
  optional google.protobuf.Timestamp delivery_terminal_at = 16;
  // The most recent delivery attempt, when the dispatcher has started one.
  optional hephaestus.common.v1.OpaqueId delivery_attempt_id = 17;
  optional hephaestus.common.v1.OpaqueId run_id = 18;
  string run_state = 19;
  string run_outcome = 20;
}

message ListProjectGatewaysRequest {
  hephaestus.common.v1.OpaqueId project_id = 1;
  hephaestus.common.v1.PageRequest page = 2;
}
message ListProjectGatewaysResponse {
  repeated GatewaySummary gateways = 1;
  hephaestus.common.v1.PageResponse page = 2;
}
message GetGatewayRequest {
  hephaestus.common.v1.OpaqueId gateway_id = 1;
  hephaestus.common.v1.PageRequest page = 2;
}
message GetGatewayResponse {
  GatewaySummary gateway = 1;
  repeated GatewayRevision revisions = 2;
  hephaestus.common.v1.PageResponse page = 3;
}
message InstallReleaseGatewaysRequest {
  hephaestus.common.v1.RequestContext context = 1;
  hephaestus.common.v1.OpaqueId release_id = 2;
}
message InstallReleaseGatewaysResponse {
  hephaestus.common.v1.MutationReceipt receipt = 1;
}
message GatewaySecretSelection {
  string slot_key = 1;
  hephaestus.common.v1.OpaqueId import_id = 2;
  hephaestus.common.v1.OpaqueId secret_version_id = 3;
  string route_path = 4;
  string header_name = 5;
}
message ConfigureGatewayRequest {
  hephaestus.common.v1.RequestContext context = 1;
  hephaestus.common.v1.OpaqueId gateway_id = 2;
  // For stateless gateways this is the active revision. For HTTP services it
  // is the latest declared revision (desired_service_revision_id when set,
  // otherwise active_revision_id).
  hephaestus.common.v1.OpaqueId expected_revision_id = 3;
  repeated hephaestus.common.v1.ParameterValue parameters = 4;
  repeated GatewaySecretSelection secret_selections = 5;
}
message ConfigureGatewayResponse {
  hephaestus.common.v1.OpaqueId revision_id = 1;
  hephaestus.common.v1.MutationReceipt receipt = 2;
}
message ListGatewayIngressRequest {
  hephaestus.common.v1.OpaqueId gateway_id = 1;
  hephaestus.common.v1.PageRequest page = 2;
}
message ListGatewayIngressResponse {
  repeated GatewayIngress ingress = 1;
  hephaestus.common.v1.PageResponse page = 2;
}

message ListGatewayServiceLogsRequest {
  GatewayServiceLogScope scope = 1;
  // Must be 1..100; zero is invalid rather than an unbounded default.
  uint32 limit = 2;
  // Opaque cursor bound to the exact five-field scope. The planned signed
  // cursor codec accepts at most 192 encoded bytes; malformed, tampered, or
  // cross-scope cursors are invalid rather than plain sequence numbers.
  hephaestus.common.v1.Cursor after = 3;
}
message ListGatewayServiceLogsResponse {
  GatewayServiceLogMetadata metadata = 1;
  repeated GatewayServiceLogRecord records = 2;
  bool history_incomplete = 3;
  hephaestus.common.v1.Cursor next_after = 4;
}
message SetGatewayLifecycleRequest {
  hephaestus.common.v1.RequestContext context = 1;
  hephaestus.common.v1.OpaqueId gateway_id = 2;
  GatewayLifecycle expected = 3;
  GatewayLifecycle next = 4;
}
message SetGatewayLifecycleResponse {
  GatewaySummary gateway = 1;
  hephaestus.common.v1.MutationReceipt receipt = 2;
}

message CreateMailboxBindingRequest {
  hephaestus.common.v1.RequestContext context = 1;
  hephaestus.common.v1.OpaqueId gateway_revision_id = 2;
  string slot_key = 3;
  hephaestus.common.v1.OpaqueId mailbox_id = 4;
  string producer_id = 5;
}
message CreateMailboxBindingResponse {
  GatewayMailboxBinding binding = 1;
  hephaestus.common.v1.MutationReceipt receipt = 2;
}
message RevokeMailboxBindingGrantRequest {
  hephaestus.common.v1.RequestContext context = 1;
  hephaestus.common.v1.OpaqueId binding_id = 2;
}
message RevokeMailboxBindingGrantResponse {
  GatewayMailboxBinding binding = 1;
  hephaestus.common.v1.MutationReceipt receipt = 2;
}
message ListMailboxBindingsRequest {
  hephaestus.common.v1.OpaqueId gateway_revision_id = 1;
  hephaestus.common.v1.PageRequest page = 2;
}
message ListMailboxBindingsResponse {
  repeated GatewayMailboxBinding bindings = 1;
  hephaestus.common.v1.PageResponse page = 2;
}
message ListMailboxPublicationsRequest {
  hephaestus.common.v1.OpaqueId gateway_id = 1;
  hephaestus.common.v1.PageRequest page = 2;
}
message ListMailboxPublicationsResponse {
  repeated GatewayMailboxPublication publications = 1;
  hephaestus.common.v1.PageResponse page = 2;
}
