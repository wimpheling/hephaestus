syntax = "proto3";

package hephaestus.builder.v1;

import "google/protobuf/timestamp.proto";
import "hephaestus/common/v1/common.proto";
import "hephaestus/options/v1/options.proto";

service BuilderCatalogService {
  rpc ListBuilderImages(ListBuilderImagesRequest) returns (ListBuilderImagesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "builder_catalog.list"
      audience: "/hephaestus.builder.v1.BuilderCatalogService/ListBuilderImages"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 4096;
    option (hephaestus.options.v1.max_response_bytes) = 1048576;
  }
  rpc GetBuilderImage(GetBuilderImageRequest) returns (GetBuilderImageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "builder_catalog.read"
      audience: "/hephaestus.builder.v1.BuilderCatalogService/GetBuilderImage"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 4096;
    option (hephaestus.options.v1.max_response_bytes) = 65536;
  }
  rpc ValidateAgentConfig(ValidateAgentConfigRequest) returns (ValidateAgentConfigResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "builder_catalog.validate"
      audience: "/hephaestus.builder.v1.BuilderCatalogService/ValidateAgentConfig"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 65536;
    option (hephaestus.options.v1.max_response_bytes) = 16384;
  }
  rpc ListProjectBuilders(ListProjectBuildersRequest) returns (ListProjectBuildersResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "project_builder.list"
      audience: "/hephaestus.builder.v1.BuilderCatalogService/ListProjectBuilders"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 1048576;
  }
  rpc GetProjectBuilder(GetProjectBuilderRequest) returns (GetProjectBuilderResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "project_builder.read"
      audience: "/hephaestus.builder.v1.BuilderCatalogService/GetProjectBuilder"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 4096;
    option (hephaestus.options.v1.max_response_bytes) = 65536;
  }
}

enum PreparationState {
  PREPARATION_STATE_UNSPECIFIED = 0;
  PREPARATION_STATE_READY = 1;
  PREPARATION_STATE_PREPARING = 2;
  PREPARATION_STATE_FAILED = 3;
}

enum AvailabilityState {
  AVAILABILITY_STATE_UNSPECIFIED = 0;
  AVAILABILITY_STATE_AVAILABLE = 1;
  AVAILABILITY_STATE_UNAVAILABLE = 2;
  AVAILABILITY_STATE_RETIRED = 3;
}

// Lifecycle owned by the forge registry control plane. This is deliberately
// distinct from a builder's source/preparation lifecycle: a completed build is
// not usable until its immutable registry publication is approved.
enum RegistryPublicationState {
  REGISTRY_PUBLICATION_STATE_UNSPECIFIED = 0;
  REGISTRY_PUBLICATION_STATE_NOT_REQUESTED = 1;
  REGISTRY_PUBLICATION_STATE_PENDING = 2;
  REGISTRY_PUBLICATION_STATE_PUBLISHING = 3;
  REGISTRY_PUBLICATION_STATE_VERIFIED = 4;
  REGISTRY_PUBLICATION_STATE_APPROVED = 5;
  REGISTRY_PUBLICATION_STATE_MISSING = 6;
  REGISTRY_PUBLICATION_STATE_RETIRED = 7;
  REGISTRY_PUBLICATION_STATE_FAILED = 8;
}

enum RegistryAvailabilityState {
  REGISTRY_AVAILABILITY_STATE_UNSPECIFIED = 0;
  REGISTRY_AVAILABILITY_STATE_AVAILABLE = 1;
  REGISTRY_AVAILABILITY_STATE_UNAVAILABLE = 2;
  REGISTRY_AVAILABILITY_STATE_RETIRED = 3;
}

enum RegistryEvidenceState {
  REGISTRY_EVIDENCE_STATE_UNSPECIFIED = 0;
  REGISTRY_EVIDENCE_STATE_PENDING = 1;
  REGISTRY_EVIDENCE_STATE_VERIFIED = 2;
  REGISTRY_EVIDENCE_STATE_NOT_REQUIRED = 3;
}

enum DependencyPolicy {
  DEPENDENCY_POLICY_UNSPECIFIED = 0;
  DEPENDENCY_POLICY_VENDORED_OFFLINE = 1;
  DEPENDENCY_POLICY_READ_ONLY_PLATFORM_CACHE = 2;
  DEPENDENCY_POLICY_CONSTRAINED_REGISTRY_EGRESS = 3;
}

message Toolchain {
  string name = 1;
  string version = 2;
}

message Provenance {
  string source = 1;
  optional string signature = 2;
  optional string sbom = 3;
}

// A digest-pinned supply-chain referrer that has been verified by the forge.
// This exposes neither OCI credentials nor Zot implementation details.
message RegistryEvidence {
  RegistryEvidenceState state = 1;
  optional string immutable_reference = 2;
}

// Safe, read-only registry control-plane projection for a builder image.
// `immutable_reference` is an internal authority/path@sha256 reference only;
// it is never a token, callback payload, storage location, or private endpoint.
message RegistryPublication {
  RegistryPublicationState state = 1;
  RegistryAvailabilityState availability = 2;
  optional string immutable_reference = 3;
  repeated string architectures = 4;
  RegistryEvidence sbom = 5;
  RegistryEvidence provenance = 6;
  RegistryEvidence scan = 7;
  RegistryEvidence signature = 8;
}

message BuilderImage {
  hephaestus.common.v1.OpaqueId id = 1;
  string key = 2;
  string display_name = 3;
  string image_reference = 4;
  repeated Toolchain toolchains = 5;
  repeated string architectures = 6;
  PreparationState preparation = 7;
  AvailabilityState availability = 8;
  hephaestus.common.v1.NetworkPolicy network_ceiling = 9;
  uint32 max_vcpus = 10;
  uint32 max_memory_mib = 11;
  DependencyPolicy dependency_policy = 12;
  Provenance provenance = 13;
  string platform_policy_version = 14;
  RegistryPublication registry_publication = 15;
}

message ListBuilderImagesRequest {
  hephaestus.common.v1.PageRequest page = 1;
}

message ListBuilderImagesResponse {
  repeated BuilderImage builder_images = 1;
  hephaestus.common.v1.PageResponse page = 2;
}

message GetBuilderImageRequest {
  hephaestus.common.v1.OpaqueId builder_image_id = 1;
}

message GetBuilderImageResponse {
  BuilderImage builder_image = 1;
}

message ValidateAgentConfigRequest {
  bytes agent_toml = 1 [(hephaestus.options.v1.sensitive) = true];
}

message ValidateAgentConfigResponse {
  BuilderImage builder_image = 1;
  hephaestus.common.v1.NetworkPolicy network = 2;
  uint32 vcpus = 3;
  uint32 memory_mib = 4;
  string platform_policy_version = 5;
}

enum ProjectBuilderStatus {
  PROJECT_BUILDER_STATUS_UNSPECIFIED = 0;
  PROJECT_BUILDER_STATUS_DRAFT = 1;
  PROJECT_BUILDER_STATUS_PREPARING = 2;
  PROJECT_BUILDER_STATUS_READY = 3;
  PROJECT_BUILDER_STATUS_FAILED = 4;
  PROJECT_BUILDER_STATUS_RETIRED = 5;
}

message ProjectBuilderProvenance {
  string source_revision = 1;
  string context_digest = 2;
  string attestation_reference = 3;
  optional string sbom_reference = 4;
}

message ProjectBuilder {
  hephaestus.common.v1.OpaqueId id = 1;
  hephaestus.common.v1.OpaqueId project_id = 2;
  hephaestus.common.v1.OpaqueId source_repository_id = 3;
  string key = 4;
  string display_name = 5;
  string source_revision = 6;
  string dockerfile_path = 7;
  string context_path = 8;
  string context_digest = 9;
  string approved_base_image_reference = 10;
  ProjectBuilderStatus status = 11;
  optional string oci_image_reference = 12;
  optional string oci_image_digest = 13;
  optional ProjectBuilderProvenance provenance = 14;
  optional string failure_reason = 15;
  google.protobuf.Timestamp created_at = 16;
  google.protobuf.Timestamp updated_at = 17;
  RegistryPublication registry_publication = 18;
}

message ListProjectBuildersRequest {
  hephaestus.common.v1.OpaqueId project_id = 1;
  hephaestus.common.v1.PageRequest page = 2;
}

message ListProjectBuildersResponse {
  repeated ProjectBuilder builders = 1;
  hephaestus.common.v1.PageResponse page = 2;
}

message GetProjectBuilderRequest {
  hephaestus.common.v1.OpaqueId project_id = 1;
  hephaestus.common.v1.OpaqueId builder_id = 2;
}

message GetProjectBuilderResponse {
  ProjectBuilder builder = 1;
}
