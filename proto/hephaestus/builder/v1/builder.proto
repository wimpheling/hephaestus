syntax = "proto3";

package hephaestus.builder.v1;

import "hephaestus/common/v1/common.proto";
import "hephaestus/options/v1/options.proto";

service BuilderCatalogService {
  rpc ListBuilderImages(ListBuilderImagesRequest) returns (ListBuilderImagesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "builder_catalog.list"
      audience: "/hephaestus.builder.v1.BuilderCatalogService/ListBuilderImages"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 4096;
    option (hephaestus.options.v1.max_response_bytes) = 1048576;
  }
  rpc GetBuilderImage(GetBuilderImageRequest) returns (GetBuilderImageResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "builder_catalog.read"
      audience: "/hephaestus.builder.v1.BuilderCatalogService/GetBuilderImage"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 4096;
    option (hephaestus.options.v1.max_response_bytes) = 65536;
  }
  rpc ValidateAgentConfig(ValidateAgentConfigRequest) returns (ValidateAgentConfigResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "builder_catalog.validate"
      audience: "/hephaestus.builder.v1.BuilderCatalogService/ValidateAgentConfig"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 65536;
    option (hephaestus.options.v1.max_response_bytes) = 16384;
  }
}

enum PreparationState {
  PREPARATION_STATE_UNSPECIFIED = 0;
  PREPARATION_STATE_READY = 1;
  PREPARATION_STATE_PREPARING = 2;
  PREPARATION_STATE_FAILED = 3;
}

enum AvailabilityState {
  AVAILABILITY_STATE_UNSPECIFIED = 0;
  AVAILABILITY_STATE_AVAILABLE = 1;
  AVAILABILITY_STATE_UNAVAILABLE = 2;
  AVAILABILITY_STATE_RETIRED = 3;
}

enum DependencyPolicy {
  DEPENDENCY_POLICY_UNSPECIFIED = 0;
  DEPENDENCY_POLICY_VENDORED_OFFLINE = 1;
  DEPENDENCY_POLICY_READ_ONLY_PLATFORM_CACHE = 2;
  DEPENDENCY_POLICY_CONSTRAINED_REGISTRY_EGRESS = 3;
}

message Toolchain {
  string name = 1;
  string version = 2;
}

message Provenance {
  string source = 1;
  optional string signature = 2;
  optional string sbom = 3;
}

message BuilderImage {
  hephaestus.common.v1.OpaqueId id = 1;
  string key = 2;
  string display_name = 3;
  string image_reference = 4;
  repeated Toolchain toolchains = 5;
  repeated string architectures = 6;
  PreparationState preparation = 7;
  AvailabilityState availability = 8;
  hephaestus.common.v1.NetworkPolicy network_ceiling = 9;
  uint32 max_vcpus = 10;
  uint32 max_memory_mib = 11;
  DependencyPolicy dependency_policy = 12;
  Provenance provenance = 13;
  string platform_policy_version = 14;
}

message ListBuilderImagesRequest {
  hephaestus.common.v1.PageRequest page = 1;
}

message ListBuilderImagesResponse {
  repeated BuilderImage builder_images = 1;
  hephaestus.common.v1.PageResponse page = 2;
}

message GetBuilderImageRequest {
  hephaestus.common.v1.OpaqueId builder_image_id = 1;
}

message GetBuilderImageResponse {
  BuilderImage builder_image = 1;
}

message ValidateAgentConfigRequest {
  bytes agent_toml = 1 [(hephaestus.options.v1.sensitive) = true];
}

message ValidateAgentConfigResponse {
  BuilderImage builder_image = 1;
  hephaestus.common.v1.NetworkPolicy network = 2;
  uint32 vcpus = 3;
  uint32 memory_mib = 4;
  string platform_policy_version = 5;
}
