syntax = "proto3";

package hephaestus.organization.v1;

import "google/protobuf/timestamp.proto";
import "hephaestus/common/v1/common.proto";
import "hephaestus/options/v1/options.proto";

service OrganizationService {
  rpc ListOrganizations(ListOrganizationsRequest) returns (ListOrganizationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "organization.list"
      audience: "/hephaestus.organization.v1.OrganizationService/ListOrganizations"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 4096;
    option (hephaestus.options.v1.max_response_bytes) = 1048576;
  }
  rpc GetOrganization(GetOrganizationRequest) returns (GetOrganizationResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "organization.read"
      audience: "/hephaestus.organization.v1.OrganizationService/GetOrganization"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 4096;
    option (hephaestus.options.v1.max_response_bytes) = 65536;
  }
  rpc ListOrganizationRepositories(ListOrganizationRepositoriesRequest) returns (ListOrganizationRepositoriesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "repository.list"
      audience: "/hephaestus.organization.v1.OrganizationService/ListOrganizationRepositories"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 1048576;
  }
  rpc ListOrganizationProjects(ListOrganizationProjectsRequest) returns (ListOrganizationProjectsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "project.list"
      audience: "/hephaestus.organization.v1.OrganizationService/ListOrganizationProjects"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 1048576;
  }
}

message OrganizationSummary {
  hephaestus.common.v1.OpaqueId id = 1;
  string name = 2;
  int64 project_count = 3;
  int64 repository_count = 4;
}

message Organization {
  hephaestus.common.v1.OpaqueId id = 1;
  string name = 2;
}

message RepositorySummary {
  hephaestus.common.v1.OpaqueId id = 1;
  string name = 2;
  string default_branch = 3;
  bool is_public = 4;
  string project_name = 5;
  int64 run_count = 6;
  optional google.protobuf.Timestamp last_run_at = 7;
}

message ProjectSummary {
  hephaestus.common.v1.OpaqueId id = 1;
  string name = 2;
  int64 repository_count = 3;
  int64 instance_count = 4;
  int64 run_count = 5;
  optional google.protobuf.Timestamp last_activity_at = 6;
}

message ListOrganizationsRequest {
  hephaestus.common.v1.PageRequest page = 1;
}
message ListOrganizationsResponse {
  repeated OrganizationSummary organizations = 1;
  hephaestus.common.v1.PageResponse page = 2;
}
message GetOrganizationRequest {
  hephaestus.common.v1.OpaqueId organization_id = 1;
}
message GetOrganizationResponse {
  Organization organization = 1;
}
message ListOrganizationRepositoriesRequest {
  hephaestus.common.v1.OpaqueId organization_id = 1;
  hephaestus.common.v1.PageRequest page = 2;
}
message ListOrganizationRepositoriesResponse {
  repeated RepositorySummary repositories = 1;
  hephaestus.common.v1.PageResponse page = 2;
}
message ListOrganizationProjectsRequest {
  hephaestus.common.v1.OpaqueId organization_id = 1;
  hephaestus.common.v1.PageRequest page = 2;
}
message ListOrganizationProjectsResponse {
  repeated ProjectSummary projects = 1;
  hephaestus.common.v1.PageResponse page = 2;
}
