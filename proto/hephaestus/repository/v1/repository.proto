syntax = "proto3";

package hephaestus.repository.v1;

import "google/protobuf/timestamp.proto";
import "hephaestus/common/v1/common.proto";
import "hephaestus/instance/v1/instance.proto";
import "hephaestus/options/v1/options.proto";

service RepositoryService {
  rpc CreateRepository(CreateRepositoryRequest) returns (CreateRepositoryResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "repository.create"
      audience: "/hephaestus.repository.v1.RepositoryService/CreateRepository"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 16384;
    option (hephaestus.options.v1.max_response_bytes) = 4096;
  }
  rpc GetRepository(GetRepositoryRequest) returns (GetRepositoryResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "repository.read"
      audience: "/hephaestus.repository.v1.RepositoryService/GetRepository"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 4096;
    option (hephaestus.options.v1.max_response_bytes) = 2097152;
  }
  rpc ListRepositoryInstances(ListRepositoryInstancesRequest) returns (ListRepositoryInstancesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "instance.list"
      audience: "/hephaestus.repository.v1.RepositoryService/ListRepositoryInstances"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 2097152;
  }
}

message CreateRepositoryRequest {
  hephaestus.common.v1.RequestContext context = 1;
  hephaestus.common.v1.OpaqueId project_id = 2;
  string name = 3;
  string default_branch = 4;
  bool is_public = 5;
  bool agent_runs_enabled = 6;
}
message CreateRepositoryResponse {
  hephaestus.common.v1.OpaqueId repository_id = 1;
  hephaestus.common.v1.MutationReceipt receipt = 2;
}

message RepositoryRun {
  hephaestus.common.v1.OpaqueId id = 1;
  string state = 2;
  string outcome = 3;
  optional int32 exit_code = 4;
  repeated hephaestus.common.v1.Diagnostic failure = 5;
  google.protobuf.Timestamp created_at = 6;
  google.protobuf.Timestamp updated_at = 7;
  string agent_name = 8;
  string commit_sha = 9;
  string git_ref = 10;
  uint32 attempt = 11;
  hephaestus.common.v1.OpaqueId proposal_id = 12;
  string proposal_state = 13;
}
message Repository {
  hephaestus.common.v1.OpaqueId id = 1;
  string name = 2;
  string default_branch = 3;
  bool is_public = 4;
  hephaestus.common.v1.OpaqueId project_id = 5;
  string project_name = 6;
  hephaestus.common.v1.OpaqueId organization_id = 7;
  string organization_name = 8;
  repeated RepositoryRun runs = 9;
}
message RepositoryInstanceAttachment {
  hephaestus.common.v1.OpaqueId id = 1;
  hephaestus.instance.v1.RefSelector ref_selector = 2;
  hephaestus.instance.v1.TriggerPolicy trigger_policy = 3;
  bool enabled = 4;
  google.protobuf.Timestamp removed_at = 5;
  hephaestus.common.v1.OpaqueId instance_id = 6;
  string instance_name = 7;
  string instance_state = 8;
  hephaestus.common.v1.OpaqueId project_id = 9;
  string project_name = 10;
  hephaestus.common.v1.OpaqueId release_id = 11;
  string release_version = 12;
}
message GetRepositoryRequest {
  hephaestus.common.v1.OpaqueId repository_id = 1;
}
message GetRepositoryResponse {
  Repository repository = 1;
}
message ListRepositoryInstancesRequest {
  hephaestus.common.v1.OpaqueId repository_id = 1;
  hephaestus.common.v1.PageRequest page = 2;
}
message ListRepositoryInstancesResponse {
  repeated RepositoryInstanceAttachment attachments = 1;
  hephaestus.common.v1.PageResponse page = 2;
}
