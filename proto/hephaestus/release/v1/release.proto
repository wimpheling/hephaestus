syntax = "proto3";

package hephaestus.release.v1;

import "google/protobuf/timestamp.proto";
import "hephaestus/artifact/v1/artifact.proto";
import "hephaestus/build/v1/build.proto";
import "hephaestus/common/v1/common.proto";
import "hephaestus/event/v1/event.proto";
import "hephaestus/options/v1/options.proto";

service ReleaseService {
  rpc ListRepositoryReleases(ListRepositoryReleasesRequest) returns (ListRepositoryReleasesResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "release.list"
      audience: "/hephaestus.release.v1.ReleaseService/ListRepositoryReleases"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 2097152;
  }
  rpc GetRelease(GetReleaseRequest) returns (GetReleaseResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "release.read"
      audience: "/hephaestus.release.v1.ReleaseService/GetRelease"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 4096;
    option (hephaestus.options.v1.max_response_bytes) = 8388608;
  }
  rpc SetDraftVersion(SetDraftVersionRequest) returns (SetDraftVersionResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "release.publish"
      audience: "/hephaestus.release.v1.ReleaseService/SetDraftVersion"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 65536;
    option (hephaestus.options.v1.max_response_bytes) = 8388608;
  }
  rpc PublishRelease(PublishReleaseRequest) returns (PublishReleaseResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "release.publish"
      audience: "/hephaestus.release.v1.ReleaseService/PublishRelease"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 65536;
    option (hephaestus.options.v1.max_response_bytes) = 8388608;
  }
  rpc WatchRelease(WatchReleaseRequest) returns (stream WatchReleaseResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "release.watch"
      audience: "/hephaestus.release.v1.ReleaseService/WatchRelease"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_SERVER_STREAM;
    option (hephaestus.options.v1.max_request_bytes) = 8192;
    option (hephaestus.options.v1.max_response_bytes) = 4194304;
  }
  rpc InstallUi(InstallUiRequest) returns (InstallUiResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "release.ui.install"
      audience: "/hephaestus.release.v1.ReleaseService/InstallUi"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 65536;
    option (hephaestus.options.v1.max_response_bytes) = 131072;
  }
  rpc ActivateUi(ActivateUiRequest) returns (ActivateUiResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "release.ui.activate"
      audience: "/hephaestus.release.v1.ReleaseService/ActivateUi"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 65536;
    option (hephaestus.options.v1.max_response_bytes) = 131072;
  }
  rpc RollbackUi(RollbackUiRequest) returns (RollbackUiResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "release.ui.rollback"
      audience: "/hephaestus.release.v1.ReleaseService/RollbackUi"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 65536;
    option (hephaestus.options.v1.max_response_bytes) = 131072;
  }
  rpc DisableUi(DisableUiRequest) returns (DisableUiResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "release.ui.disable"
      audience: "/hephaestus.release.v1.ReleaseService/DisableUi"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 16384;
    option (hephaestus.options.v1.max_response_bytes) = 131072;
  }
  rpc RemoveUi(RemoveUiRequest) returns (RemoveUiResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "release.ui.remove"
      audience: "/hephaestus.release.v1.ReleaseService/RemoveUi"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 16384;
    option (hephaestus.options.v1.max_response_bytes) = 131072;
  }
  rpc ListUiInstallations(ListUiInstallationsRequest) returns (ListUiInstallationsResponse) {
    option idempotency_level = NO_SIDE_EFFECTS;
    option (hephaestus.options.v1.authorization) = {
      permission: "release.ui.list"
      audience: "/hephaestus.release.v1.ReleaseService/ListUiInstallations"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_QUERY;
    option (hephaestus.options.v1.max_request_bytes) = 16384;
    option (hephaestus.options.v1.max_response_bytes) = 2097152;
  }
  rpc CreateUiBrowserHandoff(CreateUiBrowserHandoffRequest) returns (CreateUiBrowserHandoffResponse) {
    option (hephaestus.options.v1.authorization) = {
      permission: "release.ui.handoff.create"
      audience: "/hephaestus.release.v1.ReleaseService/CreateUiBrowserHandoff"
      actor_source: ACTOR_SOURCE_MEDIATOR_JWT_METADATA
    };
    option (hephaestus.options.v1.operation_kind) = OPERATION_KIND_MUTATION;
    option (hephaestus.options.v1.max_request_bytes) = 65536;
    option (hephaestus.options.v1.max_response_bytes) = 16384;
  }
}

enum ReleaseState {
  RELEASE_STATE_UNSPECIFIED = 0;
  RELEASE_STATE_DRAFT = 1;
  RELEASE_STATE_PUBLISHED = 2;
  RELEASE_STATE_REVOKED = 3;
}
message ReleaseSummary {
  hephaestus.common.v1.OpaqueId id = 1;
  string version = 2;
  ReleaseState state = 3;
  string source_commit = 4;
  string source_ref = 5;
  hephaestus.common.v1.OpaqueId build_request_id = 6;
  google.protobuf.Timestamp created_at = 7;
  google.protobuf.Timestamp published_at = 8;
  string manifest_hash = 9;
  uint32 artifact_count = 10;
  uint32 exported_agent_count = 11;
}
message ReleaseAgent {
  hephaestus.common.v1.OpaqueId id = 1;
  hephaestus.common.v1.OpaqueId family_id = 2;
  string agent_key = 3;
  string display_name = 4;
  hephaestus.common.v1.RuntimeContract runtime_contract = 5;
  repeated hephaestus.common.v1.ParameterDeclaration parameter_schema = 6;
  repeated hephaestus.common.v1.SecretSlotDeclaration secret_slot_schema = 7;
  bool requires_state = 8;
  hephaestus.common.v1.UpdateHook update_hook = 9;
  google.protobuf.Timestamp created_at = 10;
}
message Release {
  hephaestus.common.v1.OpaqueId id = 1;
  string version = 2;
  ReleaseState state = 3;
  string source_commit = 4;
  string source_ref = 5;
  hephaestus.common.v1.OpaqueId build_request_id = 6;
  string build_definition_hash = 7;
  string configuration_hash = 8;
  string manifest_hash = 9;
  google.protobuf.Timestamp created_at = 10;
  google.protobuf.Timestamp published_at = 11;
  google.protobuf.Timestamp revoked_at = 12;
  hephaestus.common.v1.OpaqueId repository_id = 13;
  string repository_name = 14;
  hephaestus.common.v1.OpaqueId project_id = 15;
  string project_name = 16;
  hephaestus.common.v1.OpaqueId organization_id = 17;
  string organization_name = 18;
  hephaestus.build.v1.Build build = 19;
  repeated hephaestus.artifact.v1.Artifact artifacts = 20;
  repeated ReleaseAgent agents = 21;
  // Immutable, authorized inspection metadata for release-owned UIs. Gateway
  // routes here are declaration metadata, never authorized browser URLs.
  repeated ReleaseUiDescriptor ui_descriptors = 22;
}

enum ReleaseUiScope {
  RELEASE_UI_SCOPE_UNSPECIFIED = 0;
  RELEASE_UI_SCOPE_PROJECT = 1;
  RELEASE_UI_SCOPE_REPOSITORY = 2;
  RELEASE_UI_SCOPE_GLOBAL = 3;
}

enum ReleaseUiIcon {
  RELEASE_UI_ICON_UNSPECIFIED = 0;
  RELEASE_UI_ICON_APP = 1;
  RELEASE_UI_ICON_CHAT = 2;
  RELEASE_UI_ICON_CODE = 3;
  RELEASE_UI_ICON_BOOK = 4;
  RELEASE_UI_ICON_CHART = 5;
}

enum ReleaseUiPresentation {
  RELEASE_UI_PRESENTATION_UNSPECIFIED = 0;
  RELEASE_UI_PRESENTATION_IFRAME = 1;
  RELEASE_UI_PRESENTATION_FULL_PAGE = 2;
}

enum ReleaseUiCachePolicy {
  RELEASE_UI_CACHE_POLICY_UNSPECIFIED = 0;
  RELEASE_UI_CACHE_POLICY_NO_STORE = 1;
}

message ReleaseUiDescriptor {
  string key = 1;
  ReleaseUiScope scope = 2;
  string label = 3;
  ReleaseUiIcon icon = 4;
  ReleaseUiPresentation presentation = 5;
  // Validated platform-relative route metadata; this is not a browser URL.
  string route_base = 6;
  // Validated UI-relative entrypoint metadata; this is not a browser URL.
  string entrypoint = 7;
  uint32 ui_kit_version = 8;
  ReleaseUiCachePolicy cache = 9;
  oneof content {
    ReleaseUiStaticContent static_content = 10;
    ReleaseUiManagedService managed_service = 11;
  }
  repeated ReleaseUiApiBinding apis = 12;
}

message ReleaseUiStaticContent {
  repeated ReleaseUiStaticFile files = 1;
}

message ReleaseUiStaticFile {
  // Validated UI-relative route metadata; this is not a browser URL.
  string route = 1;
  hephaestus.common.v1.OpaqueId artifact_id = 2;
  string media_type = 3;
}

message ReleaseUiManagedService {
  // Repository gateway declaration name, not an origin or browser URL.
  string gateway_name = 1;
  // Validated gateway route metadata; this is not an authorized browser URL.
  string route = 2;
  hephaestus.common.v1.OpaqueId release_agent_id = 3;
}

message ReleaseUiApiBinding {
  string key = 1;
  // Repository gateway declaration name, not an origin or browser URL.
  string gateway_name = 2;
  string method = 3;
  // Validated gateway route metadata; this is not an authorized browser URL.
  string route = 4;
  hephaestus.common.v1.OpaqueId release_agent_id = 5;
}

// Exact owner scope supplied by the caller. The organization is always
// explicit at the RPC boundary, including for the global target; adapters
// pass the expected organization into the owner-locked application command,
// which rejects mismatches before replay or mutation.
message UiInstallationTarget {
  oneof target {
    // Organization-owned global installation.
    GlobalUiInstallationTarget global = 1;
    // Project-owned installation; the project must belong to organization_id.
    hephaestus.common.v1.OpaqueId project_id = 2;
    // Repository-owned installation; the repository's project must belong to organization_id.
    hephaestus.common.v1.OpaqueId repository_id = 3;
  }
}

message GlobalUiInstallationTarget {}

enum UiInstallationLifecycle {
  UI_INSTALLATION_LIFECYCLE_UNSPECIFIED = 0;
  UI_INSTALLATION_LIFECYCLE_ENABLED = 1;
  UI_INSTALLATION_LIFECYCLE_DISABLED = 2;
  UI_INSTALLATION_LIFECYCLE_REMOVED = 3;
}

enum UiInstallationContentKind {
  UI_INSTALLATION_CONTENT_KIND_UNSPECIFIED = 0;
  UI_INSTALLATION_CONTENT_KIND_STATIC = 1;
  UI_INSTALLATION_CONTENT_KIND_MANAGED_SERVICE = 2;
}

message InstallUiRequest {
  hephaestus.common.v1.RequestContext context = 1;
  // Mandatory tenant boundary. The adapter derives and checks the target owner.
  hephaestus.common.v1.OpaqueId organization_id = 2;
  UiInstallationTarget target = 3;
  hephaestus.common.v1.OpaqueId release_id = 4;
  // Exact published descriptor key within release_id.
  string ui_key = 5;
}
message InstallUiResponse {
  hephaestus.common.v1.OpaqueId installation_id = 1;
  hephaestus.common.v1.OpaqueId generation_id = 2;
  UiInstallationLifecycle lifecycle = 3;
  hephaestus.common.v1.MutationReceipt receipt = 4;
}

message ActivateUiRequest {
  hephaestus.common.v1.RequestContext context = 1;
  hephaestus.common.v1.OpaqueId installation_id = 2;
  // Required at this external boundary; stale values fail the operation precondition.
  hephaestus.common.v1.OpaqueId expected_generation_id = 3;
  hephaestus.common.v1.OpaqueId release_id = 4;
  string ui_key = 5;
}
message ActivateUiResponse {
  hephaestus.common.v1.OpaqueId installation_id = 1;
  hephaestus.common.v1.OpaqueId generation_id = 2;
  UiInstallationLifecycle lifecycle = 3;
  hephaestus.common.v1.MutationReceipt receipt = 4;
}

message RollbackUiRequest {
  hephaestus.common.v1.RequestContext context = 1;
  hephaestus.common.v1.OpaqueId installation_id = 2;
  // Required at this external boundary; stale values fail the operation precondition.
  hephaestus.common.v1.OpaqueId expected_generation_id = 3;
  hephaestus.common.v1.OpaqueId release_id = 4;
  string ui_key = 5;
}
message RollbackUiResponse {
  hephaestus.common.v1.OpaqueId installation_id = 1;
  hephaestus.common.v1.OpaqueId generation_id = 2;
  UiInstallationLifecycle lifecycle = 3;
  hephaestus.common.v1.MutationReceipt receipt = 4;
}

message DisableUiRequest {
  hephaestus.common.v1.RequestContext context = 1;
  hephaestus.common.v1.OpaqueId installation_id = 2;
  // Required at this external boundary; stale values fail the operation precondition.
  hephaestus.common.v1.OpaqueId expected_generation_id = 3;
}
message DisableUiResponse {
  hephaestus.common.v1.OpaqueId installation_id = 1;
  hephaestus.common.v1.OpaqueId generation_id = 2;
  UiInstallationLifecycle lifecycle = 3;
  hephaestus.common.v1.MutationReceipt receipt = 4;
}

message RemoveUiRequest {
  hephaestus.common.v1.RequestContext context = 1;
  hephaestus.common.v1.OpaqueId installation_id = 2;
  // Required at this external boundary; stale values fail the operation precondition.
  hephaestus.common.v1.OpaqueId expected_generation_id = 3;
}
message RemoveUiResponse {
  hephaestus.common.v1.OpaqueId installation_id = 1;
  hephaestus.common.v1.OpaqueId generation_id = 2;
  UiInstallationLifecycle lifecycle = 3;
  hephaestus.common.v1.MutationReceipt receipt = 4;
}

message ListUiInstallationsRequest {
  // Mandatory explicit tenant boundary; target is also mandatory.
  hephaestus.common.v1.OpaqueId organization_id = 1;
  UiInstallationTarget target = 2;
  hephaestus.common.v1.PageRequest page = 3;
}
message ListUiInstallationsResponse {
  repeated UiInstallationNavigation installations = 1;
  hephaestus.common.v1.PageResponse page = 2;
}
message UiInstallationNavigation {
  hephaestus.common.v1.OpaqueId installation_id = 1;
  hephaestus.common.v1.OpaqueId generation_id = 2;
  hephaestus.common.v1.OpaqueId organization_id = 3;
  UiInstallationTarget target = 4;
  UiInstallationLifecycle lifecycle = 5;
  hephaestus.common.v1.OpaqueId release_id = 6;
  string ui_key = 7;
  string label = 8;
  ReleaseUiIcon icon = 9;
  ReleaseUiPresentation presentation = 10;
  // Platform-relative declaration metadata, never a runtime URL.
  string route_base = 11;
  UiInstallationContentKind content_kind = 12;
  // False when current source CanUse or a bound permission is unavailable.
  bool launchable = 13;
}

message CreateUiBrowserHandoffRequest {
  // Correlation only for this non-replayable handoff issue; idempotency_key must be empty.
  hephaestus.common.v1.RequestContext context = 1;
  hephaestus.common.v1.OpaqueId installation_id = 2;
  hephaestus.common.v1.OpaqueId generation_id = 3;
  // Validated platform-relative initial route, never a URL or origin.
  string route = 4;
  // Exactly 32 bytes generated by Phoenix. Request-only and redacted by RPC logging.
  bytes handoff_secret = 5 [(hephaestus.options.v1.sensitive) = true];
}
message CreateUiBrowserHandoffResponse {
  hephaestus.common.v1.OpaqueId handoff_id = 1;
  hephaestus.common.v1.OpaqueId installation_id = 2;
  hephaestus.common.v1.OpaqueId generation_id = 3;
  string route = 4;
  google.protobuf.Timestamp expires_at = 5;
}

message ListRepositoryReleasesRequest {
  hephaestus.common.v1.OpaqueId repository_id = 1;
  hephaestus.common.v1.PageRequest page = 2;
}
message ListRepositoryReleasesResponse {
  repeated ReleaseSummary releases = 1;
  hephaestus.common.v1.PageResponse page = 2;
}
message GetReleaseRequest {
  hephaestus.common.v1.OpaqueId release_id = 1;
}
message GetReleaseResponse {
  Release release = 1;
}
message SetDraftVersionRequest {
  hephaestus.common.v1.RequestContext context = 1;
  hephaestus.common.v1.OpaqueId release_id = 2;
  string version = 3;
}
message SetDraftVersionResponse {
  Release release = 1;
  hephaestus.common.v1.MutationReceipt receipt = 2;
}
message PublishReleaseRequest {
  hephaestus.common.v1.RequestContext context = 1;
  hephaestus.common.v1.OpaqueId release_id = 2;
}
message PublishReleaseResponse {
  Release release = 1;
  hephaestus.common.v1.MutationReceipt receipt = 2;
}
message WatchReleaseRequest {
  hephaestus.common.v1.OpaqueId release_id = 1;
  hephaestus.common.v1.Cursor resume_cursor = 2;
  uint32 max_events = 3;
  uint64 max_total_bytes = 4;
}
message ReleaseChange {
  hephaestus.common.v1.OpaqueId event_id = 1;
  hephaestus.common.v1.Cursor cursor = 2;
  hephaestus.common.v1.OpaqueId release_id = 3;
  hephaestus.common.v1.OpaqueId repository_id = 4;
  uint64 aggregate_version = 5;
  hephaestus.event.v1.ChangeKind change = 6;
  hephaestus.event.v1.LifecycleState state = 7;
  google.protobuf.Timestamp occurred_at = 8;
}
message WatchReleaseResponse {
  uint64 sequence = 1;
  hephaestus.common.v1.Cursor committed_cursor = 2;
  oneof item {
    hephaestus.event.v1.ScopeSnapshotBarrier snapshot_barrier = 10;
    ReleaseChange event = 11;
    hephaestus.event.v1.RetentionGap retention_gap = 12;
    hephaestus.event.v1.AccessRevoked access_revoked = 13;
  }
}
