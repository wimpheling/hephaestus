version = 1

# Constraint migrations add a rule here only after every repository violation
# has been removed. Constraints 1 through 5 enable the repository-wide UI,
# LiveView state, RPC transport, durable event, and Phoenix isolation boundaries.
enabled_rules = [
  "ARCH-RULE-REGISTRY",
  "ARCH-EXCEPTION-FORMAT",
  "ARCH-CARGO-METADATA",
  "ARCH-ENV-ONLY-IN-CONFIG",
  "ARCH-HTTP-ONLY-IN-INTEGRATIONS",
  "ARCH-PROCESS-ONLY-IN-ADAPTERS",
  "ARCH-VM-PROVIDER-ONLY-IN-COMPOSITION",
  "ARCH-FILESYSTEM-ONLY-IN-ADAPTERS",
  "ARCH-CORE-NO-STD-DEPENDENCIES",
  "ARCH-CRATE-LAYERS",
  "DB-MIGRATIONS-ONLY-IN-MIGRATIONS",
  "DB-PAGINATION-STABLE-ORDER",
  "DB-RLS-CONTEXT-REQUIRED",
  "DB-SQLX-ONLY-IN-POSTGRES-ADAPTERS",
  "DB-STATIC-SQL",
  "SEC-NO-SENSITIVE-LOG-ARGUMENTS",
  "SEC-SENTINEL-NO-PLAINTEXT",
  "SEC-SENSITIVE-NO-UNRESTRICTED-FORMAT",
  "SEC-SENSITIVE-REQUEST-ANNOTATED",
  "SEC-NO-SENSITIVE-OUTPUT-FIELDS",
  "RPC-AUTHORIZATION-POLICY-DECLARED",
  "RPC-CONNECT-ONLY-IN-TRANSPORT",
  "RPC-ERRORS-MAPPED-AT-BOUNDARY",
  "RPC-GENERATED-FILES-CLEAN",
  "RPC-GENERATED-TYPES-DO-NOT-LEAK-INWARD",
  "RPC-HANDLER-IS-THIN",
  "RPC-LIST-HAS-PAGINATION",
  "RPC-METHOD-IN-SEPARATE-FILE",
  "RPC-MUTATION-HAS-IDEMPOTENCY-KEY",
  "RPC-NON_RPC-HTTP-ALLOWLIST",
  "RPC-NO-ACTOR-IN-REQUEST",
  "RPC-NO-DIRECT-CONNECT-ERROR",
  "RPC-NO-UNTYPED-APPLICATION-PAYLOADS",
  "RPC-QUERY-IDEMPOTENCY-ANNOTATED",
  "RPC-REMOVED-FIELDS-RESERVED",
  "RPC-WATCH-HAS-RESUME-CURSOR",
  "EVT-CANONICAL-ENVELOPE",
  "EVT-CONSUMER-USES-INBOX",
  "EVT-NATS-ONLY-IN-EVENT-ADAPTERS",
  "EVT-OUTBOX-PUBLISHER-ONLY",
  "EVT-REDUCER-COVERAGE",
  "EVT-SIDE-EFFECT-AFTER-DURABLE-CLAIM",
  "EVT-STATE-AND-EVENT-COMMIT-ATOMICALLY",
  "EVT-STREAM-REAUTHORIZATION",
  "EVT-TYPED-ONEOF-PAYLOAD",
  "WEB-NO-INFRASTRUCTURE-DEPENDENCIES",
  "WEB-RPC-CLIENTS-ONLY-IN-STATE",
  "WEB-NO-HANDWRITTEN-BACKEND-CLIENT",
  "WEB-NO-RAW-BACKEND-ERROR",
  "WEB-NO-FILESYSTEM-OR-PROCESS",
  "UI-RAW-HTML-ONLY-IN-COMPONENTS",
  "UI-TIER-DIRECTION",
  "UI-DECLARED-INTERACTIONS-ONLY",
  "UI-NO-CLASS-ESCAPE-HATCH",
  "UI-DESIGN-TOKENS-ONLY",
  "UI-NO-EXTERNAL-UI-IMPORTS",
  "UI-NO-DOM-INJECTION",
  "UI-PUBLIC-FACADE-COMPLETE",
  "UI-SHOWCASE-AND-TEST-PARITY",
  "UI-PAGE-STATE-COVERAGE",
  "UI-PAGE-COMPANIONS",
  "UI-LIVE-RENDERS-ONE-PAGE",
  "UI-STATE-HAS-NO-HEEX",
  "UI-PAGE-IS-PURE",
]

# ARCH-MAX-FILE-LENGTH consumes these values when its global migration is
# complete. Keeping them here makes the eventual policy reviewable and avoids
# layer-specific constants in checker code.
[maximum_file_lines]
domain = 350
application = 350
adapter = 350
transport = 350
composition = 350
development = 350
phoenix_state = 500
phoenix_page = 350
ui_component = 500

# A temporary exception has this exact shape. Scopes must identify one file
# plus either a line (`path:line`) or item (`path#item`); globs and directories
# are rejected. An exception also needs either `expires` or `tracking_task`.
#
# [[exceptions]]
# rule_id = "ARCH-MAX-FILE-LENGTH"
# scope = "crates/example/src/lib.rs#large_generated_table"
# rationale = "Split is tracked separately while the table format stabilizes."
# owner = "runtime-team"
# tracking_task = "tasks/todo/split-example-table.md"

[[exceptions]]
rule_id = "DB-STATIC-SQL"
scope = "crates/heph-app/src/gateway_recovery_tests/database.rs#isolated_startup_database"
rationale = "Test-only CREATE DATABASE cannot bind a PostgreSQL identifier; the name is generated from a UUID and restricted to lowercase hexadecimal characters with a fixed prefix."
owner = "persistent-services-runtime"
tracking_task = "tasks/done/persistent-gateway-service-runtime-and-development-workflow.md"

[[exceptions]]
rule_id = "DB-STATIC-SQL"
scope = "crates/heph-app/src/gateway_recovery_tests/database.rs#drop_isolated_startup_database"
rationale = "Test-only DROP DATABASE cannot bind a PostgreSQL identifier; the stored name is produced by the isolated fixture's UUID-only naming path."
owner = "persistent-services-runtime"
tracking_task = "tasks/done/persistent-gateway-service-runtime-and-development-workflow.md"

[[exceptions]]
rule_id = "DB-STATIC-SQL"
scope = "crates/heph-app/tests/service_log_maintenance.rs#IsolatedDatabase::create"
rationale = "Test-only CREATE DATABASE cannot bind a PostgreSQL identifier; the isolated name has a fixed prefix and UUID-derived lowercase hexadecimal suffix."
owner = "persistent-services-runtime"
tracking_task = "tasks/done/persistent-gateway-service-runtime-and-development-workflow.md"

[[exceptions]]
rule_id = "DB-STATIC-SQL"
scope = "crates/heph-app/tests/service_log_maintenance.rs#IsolatedDatabase::drop"
rationale = "Test-only DROP DATABASE cannot bind a PostgreSQL identifier; the stored isolated name is generated by the UUID-only fixture naming path and quoted."
owner = "persistent-services-runtime"
tracking_task = "tasks/done/persistent-gateway-service-runtime-and-development-workflow.md"

[[exceptions]]
rule_id = "DB-STATIC-SQL"
scope = "crates/heph-app/tests/golden/database.rs#IsolatedGoldenDatabase::create"
rationale = "Test-only CREATE DATABASE cannot bind a PostgreSQL identifier; this disposable golden fixture uses a fixed prefix and UUID-derived lowercase hexadecimal suffix."
owner = "persistent-services-runtime"
tracking_task = "tasks/done/persistent-gateway-service-runtime-and-development-workflow.md"

[[exceptions]]
rule_id = "DB-STATIC-SQL"
scope = "crates/heph-app/tests/golden/database.rs#IsolatedGoldenDatabase::cleanup"
rationale = "Test-only DROP DATABASE cannot bind a PostgreSQL identifier; this disposable golden fixture stores the validated UUID-derived database name and quotes it."
owner = "persistent-services-runtime"
tracking_task = "tasks/done/persistent-gateway-service-runtime-and-development-workflow.md"
